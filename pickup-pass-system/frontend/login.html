<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — PickupPass</title>
<!-- Load order matters: tokens, then Tailwind CDN, then the config that maps to them. -->
<link rel="stylesheet" href="./shared/theme.css" />
<link rel="stylesheet" href="./shared/components.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="./shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="pp-card pp-card--elevated w-full max-w-sm overflow-hidden">
    <!-- Brand gradient header — the signature moment, used once, on the first screen. -->
    <div class="pp-brand-surface px-8 pt-8 pb-6 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-md bg-white/15">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2 4 5v6c0 4.4 3.1 8.4 8 9.6 4.9-1.2 8-5.2 8-9.6V5l-8-3Z" fill="white" fill-opacity="0.18"/>
          <path d="M9.5 12.2l1.8 1.8 3.5-3.7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold">PickupPass</h1>
      <p class="text-sm text-white/80 mt-0.5">Safe Dismissal. Peace of Mind.</p>
    </div>

    <div class="p-8">
      <p class="text-sm text-ink-muted mb-6 text-center">Sign in to continue</p>

      <form id="loginForm" class="space-y-3">
        <input id="email" type="email" required placeholder="Email" class="pp-field" />
        <input id="password" type="password" required placeholder="Password" class="pp-field" />

        <p id="errorMsg" class="text-sm text-danger hidden"></p>

        <button type="submit" class="pp-btn pp-btn--primary w-full">
          Sign In
        </button>
      </form>

      <button id="forgotBtn" class="pp-btn pp-btn--ghost mt-4 w-full">
        Forgot password?
      </button>
    </div>
  </div>

<script type="module">
import { auth, setSubmitButtonBusy, showToast } from "./shared/firebase-init.js";
import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// If already signed in, skip straight to the right home screen.
onAuthStateChanged(auth, async (user) => {
  if (user) await routeByRole(user);
});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById("errorMsg");
  errorMsg.classList.add("hidden");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await routeByRole(cred.user);
  } catch (err) {
    errorMsg.textContent = friendlyError(err.code);
    errorMsg.classList.remove("hidden");
  }
});

document.getElementById("forgotBtn").addEventListener("click", async () => {
  const forgotButton = document.getElementById("forgotBtn");
  if (forgotButton.disabled) return;
  const email = document.getElementById("email").value.trim();
  if (!email) {
    showToast("Enter your email first, then select “Forgot password?” again.", "info");
    return;
  }
  setSubmitButtonBusy(forgotButton, true, "Sending…");
  try {
    await sendPasswordResetEmail(auth, email);
    showToast("Password reset email sent. Check your inbox.", "success");
  } catch (err) {
    showToast("Could not send reset email: " + friendlyError(err.code), "error");
  } finally {
    setSubmitButtonBusy(forgotButton, false);
  }
});

async function routeByRole(user) {
  const tokenResult = await user.getIdTokenResult(true); // force refresh so new claims apply
  const role = tokenResult.claims.role;

  switch (role) {
    case "parent":
      window.location.href = "./parent/students.html";
      break;
    case "teacher":
      window.location.href = "./teacher/scanner.html";
      break;
    case "school_admin":
      window.location.href = "./school-admin/branding.html";
      break;
    case "master_admin":
      showToast("Master admin console is not included in this build.", "info");
      break;
    default:
      document.getElementById("errorMsg").textContent =
        "Your account isn't fully set up yet. Contact your school.";
      document.getElementById("errorMsg").classList.remove("hidden");
  }
}

function friendlyError(code) {
  switch (code) {
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
      return "Incorrect email or password.";
    case "auth/too-many-requests":
      return "Too many attempts — try again in a bit.";
    default:
      return "Sign-in failed. Please try again.";
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dismissal Scanner — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/portal.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  /* The page chrome (app-bar + pill nav) is the SHARED teacher nav, identical
     to every other teacher page. Only the camera "stage" below is dark — a
     focused surface that keeps the live preview easy on the eyes in a dim
     pickup area. The dark tokens are scoped to .scanner-stage, not the body. */
  .scanner-stage { background-color: #0d1117; color: #f0f6fc; border-radius: var(--radius-lg); }
  .scanner-surface { background-color: #161b22; border: 1px solid #30363d; border-radius: var(--radius-md); }
</style>
</head>
<body class="min-h-screen pp-portal-body">

  <div id="teacherNav" data-active="scanner"></div>
  <script type="module" src="../shared/teacher-nav.js"></script>

  <!-- Overlays — IDs preserved exactly -->
  <div id="scannerAlert" role="alert"
    class="hidden fixed top-4 left-4 right-4 z-50 max-w-md mx-auto rounded-md px-4 py-3 text-center text-sm font-semibold shadow-lg"
    style="background-color:var(--danger);color:#fff;"></div>

  <div id="requestOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6"
    style="background:rgba(0,0,0,0.75);color:#fff;" aria-live="assertive">
    <div class="flex flex-col items-center gap-4 text-center">
      <div class="h-10 w-10 rounded-full border-4 border-white/20 border-t-white animate-spin"></div>
      <p id="requestOverlayMessage" class="text-lg font-semibold">Verifying pass…</p>
    </div>
  </div>

  <div id="scanErrorModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-6"
    style="background:rgba(0,0,0,0.75);" role="alertdialog" aria-modal="true" aria-labelledby="scanErrorMessage">
    <div class="pp-card pp-card--pad w-full max-w-sm text-center">
      <p class="text-lg font-bold" style="color:var(--danger);">Pass could not be verified</p>
      <p id="scanErrorMessage" class="mt-3 text-sm text-ink-muted"></p>
      <button id="scanErrorRetryBtn" type="button" class="pp-btn pp-btn--primary w-full mt-5">Scan Again</button>
    </div>
  </div>

  <main class="max-w-md mx-auto p-4">
    <h1 class="text-xl font-bold text-ink-strong mb-3">Dismissal Scanner</h1>
    <div id="gateBar" class="pp-card pp-card--pad mb-3 hidden">
      <label id="gateLabel" for="gateSelect" class="text-sm font-semibold text-ink-strong">Pickup gate</label>
      <select id="gateSelect" class="pp-field mt-2 hidden"></select>
      <p id="gateHint" class="text-xs text-ink-muted mt-1"></p>
    </div>

    <!-- Scan screen (dark camera stage) -->
    <div id="scanScreen" class="scanner-stage flex flex-col items-center justify-center p-4">
      <div id="qrReader" class="w-full max-w-sm min-h-[300px] rounded-md overflow-hidden flex items-center justify-center"
        style="background-color:#161b22;">
        <p class="text-sm" style="color:#8b949e;">Starting camera…</p>
      </div>
      <p class="mt-4 text-sm" style="color:#8b949e;">Point camera at parent's pass</p>
      <p id="scanStatus" role="alert" class="hidden mt-3 max-w-sm text-center text-sm" style="color:#f85149;"></p>
    </div>

    <!-- Verify screen (dark stage) -->
    <div id="verifyScreen" class="scanner-stage hidden flex flex-col p-4 mt-0">
      <div class="grid grid-cols-2 gap-4">
        <div class="scanner-surface p-4 flex flex-col justify-center">
          <p class="text-xs uppercase tracking-wide mb-1" style="color:#8b949e;">Student</p>
          <h2 id="studentName" class="text-2xl font-bold mt-1"></h2>
          <p id="studentGrade" class="mt-2" style="color:#c9d1d9;"></p>
          <p id="studentSection" class="text-sm" style="color:#8b949e;"></p>
        </div>
        <div class="scanner-surface p-4 flex flex-col items-center justify-center">
          <p class="text-xs uppercase tracking-wide mb-2" style="color:#8b949e;">Verify Face</p>
          <img id="parentPhoto" class="w-32 h-32 rounded-full object-cover"
            style="border:3px solid var(--primary);" />
          <p id="parentName" class="mt-2 font-medium text-center text-sm"></p>
        </div>
      </div>

      <div id="errorBanner" class="hidden rounded-md my-3 p-3 text-center font-semibold text-sm"
        style="background-color:var(--danger);color:#fff;"></div>

      <button id="approveBtn" class="mt-4 w-full py-5 rounded-md text-xl font-bold tracking-wide shadow-lg"
        style="background-color:var(--success);color:#fff;">
        ✅ APPROVE RELEASE
      </button>
      <button id="cancelBtn" class="mt-2 w-full py-3 rounded-md text-sm font-medium"
        style="background-color:#21262d;color:#c9d1d9;">
        Cancel / Scan Next
      </button>
    </div>
  </main>

<script type="module">
import { auth, db, authedFetch, showToast } from "../shared/firebase-init.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentQrToken = null;
let html5QrCode = null;
let isHandlingScan = false;
let isApprovingRelease = false;
let currentGateId = "";
let gateCount = 0;

// Sign-out, the auth guard, the signed-in email and the school identity are all
// owned by the shared teacher nav. This page keeps its auth listener only to
// start the camera once we know someone is signed in.
onAuthStateChanged(auth, async (user) => {
  if (!user) return; // nav performs the redirect

  if (typeof Html5Qrcode === "undefined") {
    showCameraProblem(
      "Scanner didn't load",
      "The scanner component couldn't load. Check your internet connection, then reload the page."
    );
    return;
  }
  try { await configurePickupGates(); } catch (err) { showToast(err.message || "Could not load pickup gates.", "error"); }
  html5QrCode = new Html5Qrcode("qrReader");
  startScanner();
});

/**
 * Turns a raw getUserMedia/html5-qrcode failure into a calm, human message with
 * a Try again button — instead of dumping "AbortError: Starting videoinput
 * failed" onto a bare panel. The camera is a live device that can be busy, be
 * denied, or hiccup; the teacher needs to know what to do, not read a stack.
 */

async function configurePickupGates() {
  const res = await authedFetch("/pickup/gates");
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Could not load pickup gates");
  const gates = Array.isArray(data.gates) ? data.gates : [];
  gateCount = gates.length;
  const bar = document.getElementById("gateBar");
  const select = document.getElementById("gateSelect");
  const hint = document.getElementById("gateHint");
  if (gates.length === 0) {
    currentGateId = "";
    bar.classList.add("hidden");
    return;
  }
  bar.classList.remove("hidden");
  if (gates.length === 1) {
    currentGateId = gates[0].id;
    select.classList.add("hidden");
    hint.textContent = `Gate: ${gates[0].campusName ? gates[0].campusName + " — " : ""}${gates[0].name}. Automatically selected.`;
    return;
  }
  currentGateId = "";
  select.innerHTML = '<option value="">Select a pickup gate…</option>' + gates.map(g => `<option value="${g.id}">${g.campusName ? g.campusName + " — " : ""}${g.name}</option>`).join('');
  select.classList.remove("hidden");
  hint.textContent = "Choose the gate where this release is taking place.";
  select.addEventListener("change", () => { currentGateId = select.value; });
}

function friendlyCameraError(err) {
  const name = err && (err.name || err.constructor?.name) || "";
  const raw = (err && (err.message || err.toString())) || "";
  if (name === "NotAllowedError" || /permission|denied/i.test(raw)) {
    return "Camera access was blocked. Allow camera access for this site in your browser, then tap Try again.";
  }
  if (name === "NotFoundError" || /no.*camera|not found|no.*device/i.test(raw)) {
    return "No camera was found on this device. Connect a camera, then tap Try again.";
  }
  if (name === "NotReadableError" || name === "AbortError" || /in use|videoinput failed|starting/i.test(raw)) {
    return "The camera couldn't start — it may be in use by another app or browser tab. Close anything else using the camera, then tap Try again.";
  }
  if (name === "OverconstrainedError") {
    return "This device's camera doesn't support the requested mode. Tap Try again to retry.";
  }
  return "The camera couldn't start. Close other apps using it and tap Try again.";
}

function showCameraProblem(title, message) {
  const reader = document.getElementById("qrReader");
  reader.innerHTML = `
    <div class="flex flex-col items-center text-center gap-3 p-6">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
      <p class="font-semibold" style="color:#f0f6fc;">${title}</p>
      <p class="text-sm" style="color:#8b949e;">${message}</p>
      <button id="cameraRetryBtn" type="button" class="pp-btn pp-btn--primary mt-1">Try again</button>
    </div>
  `;
  const retry = document.getElementById("cameraRetryBtn");
  if (retry) retry.addEventListener("click", () => {
    reader.innerHTML = '<p class="text-sm" style="color:#8b949e;">Starting camera…</p>';
    if (!html5QrCode) html5QrCode = new Html5Qrcode("qrReader");
    startScanner();
  });
}

function startScanner() {
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 240 },
    onScanSuccess,
    // 4th param: called on every frame where no code was found — not an
    // error, just per-frame "nothing here yet." Logged (not shown to the
    // user) so it's possible to tell from devtools whether scanning is
    // actively running and just not finding a code, versus not running
    // at all — the two previously looked identical from the UI alone.
    (decodeError) => { /* console.debug("scan attempt:", decodeError); */ }
  ).catch((err) => {
    showCameraProblem("Camera couldn't start", friendlyCameraError(err));
  });
}

async function onScanSuccess(decodedText) {
  if (isHandlingScan) return;
  isHandlingScan = true;

  try {
    html5QrCode.pause(true);
    currentQrToken = decodedText;
    setRequestBusy(true, "Verifying pass…");
    const requestController = new AbortController();
    const requestTimeout = setTimeout(() => requestController.abort(), 15000);
    const res = await authedFetch("/pickup/verify", {
      method: "POST",
      body: JSON.stringify({ qrToken: decodedText }),
      signal: requestController.signal,
    });
    clearTimeout(requestTimeout);
    const data = await res.json().catch(() => ({}));

    if (!res.ok || !data.valid) {
      showError(data.reason || `Verification failed (HTTP ${res.status})`);
      return;
    }

    const [studentSnap, parentSnap] = await Promise.all([
      getDoc(doc(db, "students", data.studentId)),
      getDoc(doc(db, "users", data.parentUid)),
    ]);

    if (!studentSnap.exists() || !parentSnap.exists()) {
      throw new Error("Student or parent record could not be loaded");
    }
    setRequestBusy(false);
    renderVerifyScreen(studentSnap.data(), parentSnap.data());
  } catch (err) {
    setRequestBusy(false);
    if (err.name === "AbortError") {
      showError("Verification timed out. Check that the deployed backend is reachable.");
      return;
    }
    if (err.message) {
      showError(err.message);
      return;
    }
    showError("Network error — try again");
  }
}

function renderVerifyScreen(student, parent) {
  document.getElementById("scanScreen").classList.add("hidden");
  document.getElementById("verifyScreen").classList.remove("hidden");
  document.getElementById("errorBanner").classList.add("hidden");

  document.getElementById("studentName").textContent = student.fullName;
  document.getElementById("studentGrade").textContent = `Grade: ${student.grade}`;
  document.getElementById("studentSection").textContent = `Section: ${student.section}`;

  document.getElementById("parentPhoto").src = parent.photoUrl || "../assets/default-avatar.svg";
  document.getElementById("parentName").textContent = parent.displayName || "";
}

function showError(reason) {
  // This flow fails before the verification screen becomes visible, so show
  // the message beside the paused scanner rather than only in the hidden UI.
  const alert = document.getElementById("scannerAlert");
  alert.textContent = "Scanner error: " + reason;
  alert.classList.remove("hidden");
  const status = document.getElementById("scanStatus");
  status.textContent = "Verification error: " + reason;
  status.classList.remove("hidden");
  const banner = document.getElementById("errorBanner");
  banner.textContent = "⚠️ " + reason;
  banner.classList.remove("hidden");
  document.getElementById("scanErrorMessage").textContent = reason;
  document.getElementById("scanErrorModal").classList.remove("hidden");
}

document.getElementById("approveBtn").addEventListener("click", async () => {
  if (isApprovingRelease || !currentQrToken) return;
  if (gateCount > 1 && !currentGateId) { showToast("Select the pickup gate before approving the release.", "warning"); return; }
  isApprovingRelease = true;
  setRequestBusy(true, "Approving release…");
  const approvalController = new AbortController();
  const approvalTimeout = setTimeout(() => approvalController.abort(), 15000);
  try {
  const res = await authedFetch("/pickup/approve", {
    method: "POST",
    headers: currentGateId ? { "X-Pickup-Gate-Id": currentGateId } : {},
    body: JSON.stringify({ qrToken: currentQrToken }),
    signal: approvalController.signal,
  });
  clearTimeout(approvalTimeout);
  const result = await res.json();
  if (!res.ok || result.status !== "release_approved") {
    throw new Error(result.reason || `Approval failed (HTTP ${res.status})`);
  }
  if (result.status === "release_approved") {
    showToast("Release logged successfully.", "success");
  } else {
    showToast("Approval failed: " + (result.reason || "unknown error"), "error");
  }
    resetToScanner();
  } catch (err) {
    showError(err.name === "AbortError"
      ? "Approval timed out. Check that the deployed backend is reachable."
      : (err.message || "Could not approve the release"));
  } finally {
    clearTimeout(approvalTimeout);
    isApprovingRelease = false;
    setRequestBusy(false);
  }
});

document.getElementById("cancelBtn").addEventListener("click", resetToScanner);
document.getElementById("scanErrorRetryBtn").addEventListener("click", resetToScanner);

function setRequestBusy(isBusy, message = "") {
  const overlay = document.getElementById("requestOverlay");
  document.getElementById("requestOverlayMessage").textContent = message;
  overlay.classList.toggle("hidden", !isBusy);
  document.getElementById("approveBtn").disabled = isBusy;
  document.getElementById("cancelBtn").disabled = isBusy;
}

function resetToScanner() {
  document.getElementById("verifyScreen").classList.add("hidden");
  document.getElementById("scanScreen").classList.remove("hidden");
  document.getElementById("scanStatus").classList.add("hidden");
  document.getElementById("scannerAlert").classList.add("hidden");
  document.getElementById("scanErrorModal").classList.add("hidden");
  setRequestBusy(false);
  currentQrToken = null;
  isHandlingScan = false;
  if (html5QrCode) html5QrCode.resume();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dismissal Scanner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

  <div id="scannerAlert" role="alert" class="hidden fixed top-4 left-4 right-4 z-50 max-w-md mx-auto rounded-lg bg-red-600 px-4 py-3 text-center text-sm font-semibold shadow-lg"></div>
  <div id="requestOverlay" class="hidden fixed inset-0 z-50 bg-gray-950/80 p-6 flex items-center justify-center" aria-live="assertive">
    <div class="flex flex-col items-center gap-4 text-center">
      <div class="h-10 w-10 rounded-full border-4 border-white/30 border-t-white animate-spin"></div>
      <p id="requestOverlayMessage" class="text-lg font-semibold">Verifying pass…</p>
    </div>
  </div>
  <div id="scanErrorModal" class="hidden fixed inset-0 z-[60] bg-gray-950/80 p-6 flex items-center justify-center" role="alertdialog" aria-modal="true" aria-labelledby="scanErrorMessage">
    <div class="w-full max-w-sm rounded-xl bg-white p-6 text-center text-gray-800 shadow-xl">
      <p class="text-lg font-bold text-red-600">Pass could not be verified</p>
      <p id="scanErrorMessage" class="mt-3 text-sm text-gray-600"></p>
      <button id="scanErrorRetryBtn" type="button" class="mt-5 w-full rounded-lg bg-indigo-600 py-3 font-semibold text-white hover:bg-indigo-700">Scan Again</button>
    </div>
  </div>

  <div class="p-4 flex items-center justify-between border-b border-gray-800">
    <span class="font-semibold text-lg">Dismissal Scanner</span>
    <div class="flex items-center gap-3">
      <a href="./exit-logs.html" class="text-sm text-indigo-400 font-medium">History</a>
      <a href="./students.html" class="text-sm text-indigo-400 font-medium">Students →</a>
    </div>
  </div>
  <div class="px-4 py-1.5 flex items-center justify-between border-b border-gray-800 bg-gray-800/40">
    <p id="currentUserEmail" class="text-xs text-gray-400"></p>
    <button id="signOutBtn" class="text-xs text-gray-400 underline">Sign out</button>
  </div>
  <div id="schoolBanner" class="hidden items-center justify-center gap-2 py-2 bg-gray-800/60 border-b border-gray-800">
    <img id="schoolLogo" class="w-6 h-6 rounded object-contain bg-white" />
    <span id="schoolName" class="text-sm text-gray-300"></span>
  </div>

  <div id="scanScreen" class="flex-1 flex flex-col items-center justify-center p-4">
    <div id="qrReader" class="w-full max-w-sm min-h-[300px] rounded-xl overflow-hidden bg-gray-800 flex items-center justify-center">
      <p class="text-gray-500 text-sm">Starting camera…</p>
    </div>
    <p class="mt-4 text-gray-400 text-sm">Point camera at parent's pass</p>
    <p id="scanStatus" role="alert" class="hidden mt-3 max-w-sm text-center text-sm text-red-300"></p>
  </div>

  <div id="verifyScreen" class="hidden flex-1 flex flex-col p-4">
    <div class="grid grid-cols-2 gap-4 flex-1">
      <div class="bg-gray-800 rounded-xl p-4 flex flex-col justify-center">
        <p class="text-xs uppercase text-gray-400">Student</p>
        <h2 id="studentName" class="text-2xl font-bold mt-1"></h2>
        <p id="studentGrade" class="text-gray-300 mt-2"></p>
        <p id="studentSection" class="text-gray-400 text-sm"></p>
      </div>

      <div class="bg-gray-800 rounded-xl p-4 flex flex-col items-center justify-center">
        <p class="text-xs uppercase text-gray-400 mb-2">Verify Face</p>
        <img id="parentPhoto" class="w-32 h-32 rounded-full object-cover border-4 border-indigo-500" />
        <p id="parentName" class="mt-2 font-medium text-center"></p>
      </div>
    </div>

    <div id="errorBanner" class="hidden bg-red-600 text-white p-3 rounded-lg my-3 text-center font-semibold"></div>

    <button id="approveBtn"
      class="mt-4 w-full py-5 bg-green-600 active:bg-green-700 rounded-xl text-xl font-bold tracking-wide shadow-lg">
      ✅ APPROVE RELEASE
    </button>
    <button id="cancelBtn" class="mt-2 w-full py-3 bg-gray-700 rounded-xl text-gray-300">
      Cancel / Scan Next
    </button>
  </div>

<script type="module">
import { auth, db, authedFetch, showToast } from "../shared/firebase-init.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentQrToken = null;
let html5QrCode = null;
let isHandlingScan = false;
let isApprovingRelease = false;

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "../login.html";
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
  const tokenResult = await user.getIdTokenResult();
  document.getElementById("currentUserEmail").textContent = user.email;
  await loadSchoolBranding(tokenResult.claims.schoolId);

  try {
    if (typeof Html5Qrcode === "undefined") {
      throw new Error("Scanner library failed to load — check your internet connection and reload the page.");
    }
    html5QrCode = new Html5Qrcode("qrReader");
    startScanner();
  } catch (err) {
    document.getElementById("qrReader").innerHTML =
      `<p class="text-red-400 text-sm p-4">Scanner failed to start: ${err.message || err}</p>`;
  }
});

async function loadSchoolBranding(schoolId) {
  if (!schoolId) return;
  const schoolSnap = await getDoc(doc(db, "schools", schoolId));
  if (!schoolSnap.exists()) return;

  const school = schoolSnap.data();
  document.getElementById("schoolName").textContent = school.schoolName || "";
  if (school.logoUrl) {
    document.getElementById("schoolLogo").src = school.logoUrl;
  } else {
    document.getElementById("schoolLogo").remove();
  }
  document.getElementById("schoolBanner").classList.remove("hidden");
  document.getElementById("schoolBanner").classList.add("flex");
}

function startScanner() {
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 240 },
    onScanSuccess,
    // 4th param: called on every frame where no code was found — not an
    // error, just per-frame "nothing here yet." Logged (not shown to the
    // user) so it's possible to tell from devtools whether scanning is
    // actively running and just not finding a code, versus not running
    // at all — the two previously looked identical from the UI alone.
    (decodeError) => { /* console.debug("scan attempt:", decodeError); */ }
  ).catch((err) => {
    document.getElementById("qrReader").innerHTML =
      `<p class="text-red-400 text-sm p-4">Camera error: ${err}</p>`;
  });
}

async function onScanSuccess(decodedText) {
  if (isHandlingScan) return;
  isHandlingScan = true;

  try {
    html5QrCode.pause(true);
    currentQrToken = decodedText;
    setRequestBusy(true, "Verifying pass…");
    const requestController = new AbortController();
    const requestTimeout = setTimeout(() => requestController.abort(), 15000);
    const res = await authedFetch("/pickup/verify", {
      method: "POST",
      body: JSON.stringify({ qrToken: decodedText }),
      signal: requestController.signal,
    });
    clearTimeout(requestTimeout);
    const data = await res.json().catch(() => ({}));

    if (!res.ok || !data.valid) {
      showError(data.reason || `Verification failed (HTTP ${res.status})`);
      return;
    }

    const [studentSnap, parentSnap] = await Promise.all([
      getDoc(doc(db, "students", data.studentId)),
      getDoc(doc(db, "users", data.parentUid)),
    ]);

    if (!studentSnap.exists() || !parentSnap.exists()) {
      throw new Error("Student or parent record could not be loaded");
    }
    setRequestBusy(false);
    renderVerifyScreen(studentSnap.data(), parentSnap.data());
  } catch (err) {
    setRequestBusy(false);
    if (err.name === "AbortError") {
      showError("Verification timed out. Check that the deployed backend is reachable.");
      return;
    }
    if (err.message) {
      showError(err.message);
      return;
    }
    showError("Network error — try again");
  }
}

function renderVerifyScreen(student, parent) {
  document.getElementById("scanScreen").classList.add("hidden");
  document.getElementById("verifyScreen").classList.remove("hidden");
  document.getElementById("errorBanner").classList.add("hidden");

  document.getElementById("studentName").textContent = student.fullName;
  document.getElementById("studentGrade").textContent = `Grade: ${student.grade}`;
  document.getElementById("studentSection").textContent = `Section: ${student.section}`;

  document.getElementById("parentPhoto").src = parent.photoUrl || "../assets/default-avatar.png";
  document.getElementById("parentName").textContent = parent.displayName || "";
}

function showError(reason) {
  // This flow fails before the verification screen becomes visible, so show
  // the message beside the paused scanner rather than only in the hidden UI.
  const alert = document.getElementById("scannerAlert");
  alert.textContent = "Scanner error: " + reason;
  alert.classList.remove("hidden");
  const status = document.getElementById("scanStatus");
  status.textContent = "Verification error: " + reason;
  status.classList.remove("hidden");
  const banner = document.getElementById("errorBanner");
  banner.textContent = "⚠️ " + reason;
  banner.classList.remove("hidden");
  document.getElementById("scanErrorMessage").textContent = reason;
  document.getElementById("scanErrorModal").classList.remove("hidden");
}

document.getElementById("approveBtn").addEventListener("click", async () => {
  if (isApprovingRelease || !currentQrToken) return;
  isApprovingRelease = true;
  setRequestBusy(true, "Approving release…");
  const approvalController = new AbortController();
  const approvalTimeout = setTimeout(() => approvalController.abort(), 15000);
  try {
  const res = await authedFetch("/pickup/approve", {
    method: "POST",
    body: JSON.stringify({ qrToken: currentQrToken }),
    signal: approvalController.signal,
  });
  clearTimeout(approvalTimeout);
  const result = await res.json();
  if (!res.ok || result.status !== "release_approved") {
    throw new Error(result.reason || `Approval failed (HTTP ${res.status})`);
  }
  if (result.status === "release_approved") {
    showToast("Release logged successfully.", "success");
  } else {
    showToast("Approval failed: " + (result.reason || "unknown error"), "error");
  }
    resetToScanner();
  } catch (err) {
    showError(err.name === "AbortError"
      ? "Approval timed out. Check that the deployed backend is reachable."
      : (err.message || "Could not approve the release"));
  } finally {
    clearTimeout(approvalTimeout);
    isApprovingRelease = false;
    setRequestBusy(false);
  }
});

document.getElementById("cancelBtn").addEventListener("click", resetToScanner);
document.getElementById("scanErrorRetryBtn").addEventListener("click", resetToScanner);

function setRequestBusy(isBusy, message = "") {
  const overlay = document.getElementById("requestOverlay");
  document.getElementById("requestOverlayMessage").textContent = message;
  overlay.classList.toggle("hidden", !isBusy);
  document.getElementById("approveBtn").disabled = isBusy;
  document.getElementById("cancelBtn").disabled = isBusy;
}

function resetToScanner() {
  document.getElementById("verifyScreen").classList.add("hidden");
  document.getElementById("scanScreen").classList.remove("hidden");
  document.getElementById("scanStatus").classList.add("hidden");
  document.getElementById("scannerAlert").classList.add("hidden");
  document.getElementById("scanErrorModal").classList.add("hidden");
  setRequestBusy(false);
  currentQrToken = null;
  isHandlingScan = false;
  if (html5QrCode) html5QrCode.resume();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dismissal History — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen">

  <div id="teacherNav" data-active="history"></div>
  <script type="module" src="../shared/teacher-nav.js"></script>

  <main class="max-w-lg mx-auto p-4">
    <h1 class="text-xl font-bold text-ink-strong mb-3">Dismissal History</h1>

    <div class="pp-card pp-card--pad mb-3 space-y-2">
      <input id="searchBox" type="text" placeholder="Search by student or staff name..." class="pp-field" />
      <div class="grid grid-cols-2 gap-2">
        <select id="gradeFilter" class="pp-field">
          <option value="">All Grades</option>
        </select>
        <select id="sectionFilter" class="pp-field">
          <option value="">All Sections</option>
        </select>
      </div>
      <select id="staffFilter" class="pp-field">
        <option value="">All Staff (Approved By)</option>
      </select>
    </div>

    <p id="resultCount" class="text-xs text-ink-subtle mb-2"></p>

    <div id="logList" class="space-y-2"></div>
    <div id="errorState" class="pp-alert pp-alert--danger hidden"></div>
    <div id="emptyState" class="pp-empty hidden">
      No dismissal records yet.
    </div>
    <div id="noResultsState" class="pp-empty hidden">
      No records match your filters.
    </div>
    <div id="loadingState" class="text-center text-sm text-ink-subtle py-6">Loading…</div>
  </main>

<script type="module">
import { auth, db } from "../shared/firebase-init.js";
import { collection, query, where, orderBy, limit, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentSchoolId = null;
let enrichedLogs = []; // logs joined with student + guardian + staff display info

// Sign-out, auth guard and signed-in email are owned by the shared teacher nav.
// This page keeps its auth listener only to resolve the school + load logs.
onAuthStateChanged(auth, async (user) => {
  if (!user) return; // nav performs the redirect
  const tokenResult = await user.getIdTokenResult();
  currentSchoolId = tokenResult.claims.schoolId;
  await loadLogs();
});

async function loadLogs() {
  const loadingState = document.getElementById("loadingState");
  loadingState.classList.remove("hidden");

  // Firestore has no joins — logs only store studentId/parentUid/verifiedByUid,
  // not the student's grade/section or anyone's display name. Fetch the
  // school's full roster + relevant users ONCE and build lookup maps,
  // rather than a separate read per log (which would be both slow and
  // expensive against Firestore's daily read quota on the free plan).
  try {
    // Sort in the browser so the history remains usable even when the
    // schoolId/timestamp composite index has not finished building yet.
    const [logsSnap, studentsSnap] = await Promise.all([
      getDocs(query(
        collection(db, "exitLogs"),
        where("schoolId", "==", currentSchoolId),
        limit(200)
      )),
      getDocs(query(collection(db, "students"), where("schoolId", "==", currentSchoolId))),
    ]);

    const logDocs = [...logsSnap.docs].sort((a, b) => {
      const aTimestamp = a.data().timestamp?.toMillis?.() || 0;
      const bTimestamp = b.data().timestamp?.toMillis?.() || 0;
      return bTimestamp - aTimestamp;
    });

  const studentsById = {};
  studentsSnap.forEach((d) => { studentsById[d.id] = d.data(); });

  // Collect every distinct uid we'll need a display name/photo for
  // (guardians who picked up + staff who approved), then batch-fetch them.
  const uidsNeeded = new Set();
  logDocs.forEach((d) => {
    const log = d.data();
    if (log.parentUid) uidsNeeded.add(log.parentUid);
    if (log.verifiedByUid) uidsNeeded.add(log.verifiedByUid);
  });
  const usersById = await fetchUsersByIds([...uidsNeeded]);

  enrichedLogs = logDocs.map((d) => {
    const log = d.data();
    const student = studentsById[log.studentId] || {};
    const guardian = usersById[log.parentUid] || {};
    const staff = usersById[log.verifiedByUid] || {};
    return {
      id: d.id,
      studentName: student.fullName || "Unknown Student",
      grade: student.grade || "",
      section: student.section || "",
      guardianName: guardian.displayName || "Unknown Guardian",
      staffName: staff.displayName || "Unknown Staff",
      timestamp: log.timestamp?.toDate ? log.timestamp.toDate() : null,
    };
  });

  loadingState.classList.add("hidden");

  if (enrichedLogs.length === 0) {
    document.getElementById("emptyState").classList.remove("hidden");
    return;
  }

    populateFilterOptions();
    render();
  } catch (err) {
    loadingState.classList.add("hidden");
    const errorState = document.getElementById("errorState");
    errorState.textContent = `Could not load dismissal history: ${err.message || err}`;
    errorState.classList.remove("hidden");
  }
}

async function fetchUsersByIds(uids) {
  const usersById = {};
  // Firestore has no "get many docs by ID" batch read in the modular SDK
  // without a composite index workaround, so fetch each individually —
  // uidsNeeded is small (a couple people per log, deduplicated), so this
  // stays well within reasonable read counts for a day's dismissals.
  await Promise.all(uids.map(async (uid) => {
    const snap = await getDoc(doc(db, "users", uid));
    if (snap.exists()) usersById[uid] = snap.data();
  }));
  return usersById;
}

function populateFilterOptions() {
  const grades = [...new Set(enrichedLogs.map((l) => l.grade).filter(Boolean))].sort();
  const sections = [...new Set(enrichedLogs.map((l) => l.section).filter(Boolean))].sort();
  const staff = [...new Set(enrichedLogs.map((l) => l.staffName).filter(Boolean))].sort();

  const gradeSelect = document.getElementById("gradeFilter");
  grades.forEach((g) => {
    const opt = document.createElement("option");
    opt.value = g; opt.textContent = `Grade ${g}`;
    gradeSelect.appendChild(opt);
  });

  const sectionSelect = document.getElementById("sectionFilter");
  sections.forEach((s) => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = `Section ${s}`;
    sectionSelect.appendChild(opt);
  });

  const staffSelect = document.getElementById("staffFilter");
  staff.forEach((s) => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    staffSelect.appendChild(opt);
  });
}

function render() {
  const searchTerm = document.getElementById("searchBox").value.trim().toLowerCase();
  const gradeVal = document.getElementById("gradeFilter").value;
  const sectionVal = document.getElementById("sectionFilter").value;
  const staffVal = document.getElementById("staffFilter").value;

  const filtered = enrichedLogs.filter((l) => {
    if (gradeVal && l.grade !== gradeVal) return false;
    if (sectionVal && l.section !== sectionVal) return false;
    if (staffVal && l.staffName !== staffVal) return false;
    if (searchTerm) {
      const haystack = `${l.studentName} ${l.guardianName} ${l.staffName}`.toLowerCase();
      if (!haystack.includes(searchTerm)) return false;
    }
    return true;
  });

  document.getElementById("resultCount").textContent =
    `${filtered.length} of ${enrichedLogs.length} record${enrichedLogs.length === 1 ? "" : "s"}`;

  const list = document.getElementById("logList");
  const noResultsState = document.getElementById("noResultsState");
  list.innerHTML = "";

  if (filtered.length === 0) {
    noResultsState.classList.remove("hidden");
    return;
  }
  noResultsState.classList.add("hidden");

  filtered.forEach((l) => {
    const card = document.createElement("div");
    card.className = "pp-card pp-card--pad";
    card.innerHTML = `
      <div class="flex items-center justify-between">
        <p class="font-semibold text-ink-strong">${escapeHtml(l.studentName)}</p>
        <p class="text-xs text-ink-subtle">${l.timestamp ? formatTime(l.timestamp) : "-"}</p>
      </div>
      <p class="text-xs text-ink-muted mb-1">Grade ${escapeHtml(l.grade || "-")} · Section ${escapeHtml(l.section || "-")}</p>
      <p class="text-sm text-ink flex items-center gap-1.5"><span class="pp-dot pp-dot--success"></span>Picked up by <span class="font-medium">${escapeHtml(l.guardianName)}</span></p>
      <p class="text-xs text-ink-subtle">Approved by ${escapeHtml(l.staffName)}</p>
    `;
    list.appendChild(card);
  });
}

["searchBox", "gradeFilter", "sectionFilter", "staffFilter"].forEach((id) => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});

function formatTime(date) {
  return date.toLocaleString(undefined, {
    year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit"
  });
  return date;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

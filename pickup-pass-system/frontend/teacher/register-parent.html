<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register Parent — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen">

  <div id="teacherNav" data-active="students"></div>
  <script type="module" src="../shared/teacher-nav.js"></script>

  <main class="max-w-lg mx-auto p-4">
    <a href="./students.html" class="pp-backlink mb-3">← Back to Students</a>

    <h1 class="text-xl font-bold text-ink-strong mb-1">Register Parent</h1>
    <p id="studentLabel" class="text-sm text-ink-muted mb-4"></p>

    <div class="pp-card pp-card--pad">
      <p class="pp-alert pp-alert--info mb-4">
        They'll get an email to set their password and upload a photo. Once
        set up, they can generate pickup passes for this student.
      </p>

      <form id="registerForm" class="space-y-3">
        <input id="lastName" type="text" required placeholder="Last name" class="pp-field" />
        <input id="firstName" type="text" required placeholder="First name" class="pp-field" />
        <div class="flex gap-2">
          <input id="middleInitial" type="text" maxlength="4" placeholder="M.I." class="pp-field w-1/3" />
          <input id="suffix" type="text" placeholder="Suffix (Jr., III...)" class="pp-field w-2/3" />
        </div>
        <input id="parentEmail" type="email" required placeholder="Email address" class="pp-field" />
        <select id="relationship" class="pp-field">
          <option value="parent/guardian">Parent / Guardian</option>
          <option value="grandparent">Grandparent</option>
          <option value="relative">Other Relative</option>
          <option value="caregiver">Caregiver / Nanny</option>
          <option value="authorized pickup">Other Authorized Pickup</option>
        </select>

        <p id="errorMsg" class="pp-alert pp-alert--danger hidden" style="display: none"></p>
        <p id="successMsg" class="pp-alert pp-alert--success hidden" style="display: none"></p>

        <button type="submit" class="pp-btn pp-btn--primary w-full">
          Register Parent
        </button>
      </form>
    </div>
  </main>

<script type="module">
import { auth, db, authedFetch, setSubmitButtonBusy, showToast } from "../shared/firebase-init.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const params = new URLSearchParams(window.location.search);
const studentId = params.get("studentId") || sessionStorage.getItem("pendingParentStudentId");

if (!studentId) {
  window.location.href = "./students.html";
}

// Sign-out, auth guard and signed-in email are owned by the shared teacher nav.
// This page keeps its auth listener only to load the student it's registering for.
onAuthStateChanged(auth, async (user) => {
  if (!user) return; // nav performs the redirect
  const studentSnap = await getDoc(doc(db, "students", studentId));
  if (studentSnap.exists()) {
    const s = studentSnap.data();
    document.getElementById("studentLabel").textContent =
      `${s.fullName} · Grade ${s.grade || "-"}`;
  }
});

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitButton = e.currentTarget.querySelector('button[type="submit"]');
  if (submitButton.disabled) return;
  setSubmitButtonBusy(submitButton, true, "Registering…");
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  errorMsg.classList.add("hidden");
  successMsg.classList.add("hidden");

  const lastName = document.getElementById("lastName").value.trim();
  const firstName = document.getElementById("firstName").value.trim();
  const middleInitial = document.getElementById("middleInitial").value.trim();
  const suffix = document.getElementById("suffix").value.trim();
  const parentEmail = document.getElementById("parentEmail").value.trim();
  const relationship = document.getElementById("relationship").value;

  try {
    const res = await authedFetch("/teacher/register-parent", {
      method: "POST",
      body: JSON.stringify({ studentId, lastName, firstName, middleInitial, suffix, parentEmail, relationship }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not register parent");

    if (data.status === "linked_existing") {
      successMsg.textContent = `Linked — ${parentEmail} already had an account.`;
    } else if (data.emailSent) {
      successMsg.textContent = `Invite sent to ${parentEmail}.`;
    } else {
      successMsg.textContent = `Account created for ${parentEmail}, but the invite email couldn't be sent — ask them to use "Forgot password?" on the sign-in page with this email.`;
    }
    successMsg.classList.remove("hidden");
    showToast(successMsg.textContent, data.emailSent === false ? "warning" : "success");
    e.target.reset();
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.classList.remove("hidden");
    showToast(err.message || "Could not register parent.", "error");
  } finally {
    setSubmitButtonBusy(submitButton, false);
  }
});
</script>
</body>
</html>

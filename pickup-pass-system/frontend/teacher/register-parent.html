<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register Parent — Pickup Pass</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <div class="max-w-sm mx-auto pt-2">
    <div class="flex items-center justify-between">
      <a href="./students.html" class="text-sm text-indigo-600 font-medium">← Students</a>
      <button id="signOutBtn" class="text-xs text-gray-400 underline">Sign out</button>
    </div>
    <p id="currentUserEmail" class="text-xs text-gray-400 mt-1"></p>

    <h1 class="text-xl font-bold text-gray-800 mt-2 mb-1">Register Parent</h1>
    <p id="studentLabel" class="text-sm text-gray-500 mb-6"></p>

    <div class="bg-white rounded-2xl shadow-sm p-6">
      <p class="text-xs text-gray-500 mb-4">
        They'll get an email to set their password and upload a photo. Once
        set up, they can generate pickup passes for this student.
      </p>

      <form id="registerForm" class="space-y-3">
        <input id="lastName" type="text" required placeholder="Last name"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <input id="firstName" type="text" required placeholder="First name"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <div class="flex gap-2">
          <input id="middleInitial" type="text" maxlength="4" placeholder="M.I."
            class="w-1/3 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <input id="suffix" type="text" placeholder="Suffix (Jr., III...)"
            class="w-2/3 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <input id="parentEmail" type="email" required placeholder="Email address"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <select id="relationship"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="parent/guardian">Parent / Guardian</option>
          <option value="grandparent">Grandparent</option>
          <option value="relative">Other Relative</option>
          <option value="caregiver">Caregiver / Nanny</option>
          <option value="authorized pickup">Other Authorized Pickup</option>
        </select>

        <p id="errorMsg" class="hidden" style="display: none"></p>
        <p id="successMsg" class="hidden" style="display: none"></p>

        <button type="submit"
          class="w-full py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition">
          Register Parent
        </button>
      </form>
    </div>
  </div>

<script type="module">
import { auth, db, authedFetch, setSubmitButtonBusy, showToast } from "../shared/firebase-init.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const params = new URLSearchParams(window.location.search);
const studentId = params.get("studentId") || sessionStorage.getItem("pendingParentStudentId");

if (!studentId) {
  window.location.href = "./students.html";
}

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "../login.html";
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
  document.getElementById("currentUserEmail").textContent = user.email;
  const studentSnap = await getDoc(doc(db, "students", studentId));
  if (studentSnap.exists()) {
    const s = studentSnap.data();
    document.getElementById("studentLabel").textContent =
      `${s.fullName} · Grade ${s.grade || "-"}`;
  }
});

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitButton = e.currentTarget.querySelector('button[type="submit"]');
  if (submitButton.disabled) return;
  setSubmitButtonBusy(submitButton, true, "Registering…");
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  errorMsg.classList.add("hidden");
  successMsg.classList.add("hidden");

  const lastName = document.getElementById("lastName").value.trim();
  const firstName = document.getElementById("firstName").value.trim();
  const middleInitial = document.getElementById("middleInitial").value.trim();
  const suffix = document.getElementById("suffix").value.trim();
  const parentEmail = document.getElementById("parentEmail").value.trim();
  const relationship = document.getElementById("relationship").value;

  try {
    const res = await authedFetch("/teacher/register-parent", {
      method: "POST",
      body: JSON.stringify({ studentId, lastName, firstName, middleInitial, suffix, parentEmail, relationship }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not register parent");

    if (data.status === "linked_existing") {
      successMsg.textContent = `Linked — ${parentEmail} already had an account.`;
    } else if (data.emailSent) {
      successMsg.textContent = `Invite sent to ${parentEmail}.`;
    } else {
      successMsg.textContent = `Account created for ${parentEmail}, but the invite email couldn't be sent — ask them to use "Forgot password?" on the sign-in page with this email.`;
    }
    successMsg.classList.remove("hidden");
    showToast(successMsg.textContent, data.emailSent === false ? "warning" : "success");
    e.target.reset();
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.classList.remove("hidden");
    showToast(err.message || "Could not register parent.", "error");
  } finally {
    setSubmitButtonBusy(submitButton, false);
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students — Pickup Pass</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <div class="max-w-sm mx-auto">
    <div class="flex items-center justify-between pt-2 mb-1">
      <h1 class="text-xl font-bold text-gray-800">Students</h1>
      <a href="./scanner.html" class="text-sm text-indigo-600 font-medium">Scanner →</a>
    </div>
    <div id="schoolBanner" class="hidden items-center gap-2 mb-4">
      <img id="schoolLogo" class="w-6 h-6 rounded object-contain bg-white border border-gray-200" />
      <span id="schoolName" class="text-sm text-gray-500"></span>
    </div>

    <div id="studentList" class="space-y-2 mb-6"></div>
    <div id="emptyState" class="hidden bg-white rounded-xl p-6 text-center text-sm text-gray-500 mb-6">
      No students yet — add your first one below.
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold text-gray-800 mb-3">Add a Student</h2>
      <form id="addStudentForm" class="space-y-2">
        <input id="studentName" type="text" required placeholder="Full name"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <div class="flex gap-2">
          <input id="studentGrade" type="text" placeholder="Grade"
            class="w-1/2 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <input id="studentSection" type="text" placeholder="Section"
            class="w-1/2 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <p id="formError" class="text-sm text-red-500 hidden"></p>

        <button type="submit"
          class="w-full py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition">
          Add Student
        </button>
      </form>
    </div>
  </div>

<script type="module">
import { auth, db, authedFetch } from "../shared/firebase-init.js";
import { collection, query, where, orderBy, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentSchoolId = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
  const tokenResult = await user.getIdTokenResult();
  currentSchoolId = tokenResult.claims.schoolId;

  await loadSchoolBranding();
  await loadStudents();
});

async function loadSchoolBranding() {
  if (!currentSchoolId) return;
  const schoolSnap = await getDoc(doc(db, "schools", currentSchoolId));
  if (!schoolSnap.exists()) return;

  const school = schoolSnap.data();
  document.getElementById("schoolName").textContent = school.schoolName || "";
  if (school.logoUrl) {
    document.getElementById("schoolLogo").src = school.logoUrl;
  } else {
    document.getElementById("schoolLogo").remove();
  }
  document.getElementById("schoolBanner").classList.remove("hidden");
  document.getElementById("schoolBanner").classList.add("flex");
}

async function loadStudents() {
  const list = document.getElementById("studentList");
  const emptyState = document.getElementById("emptyState");
  list.innerHTML = "";

  const q = query(
    collection(db, "students"),
    where("schoolId", "==", currentSchoolId),
    orderBy("fullName")
  );
  const snap = await getDocs(q);

  if (snap.empty) {
    emptyState.classList.remove("hidden");
    return;
  }
  emptyState.classList.add("hidden");

  snap.forEach((docSnap) => {
    const s = docSnap.data();
    const studentId = docSnap.id;
    const guardianCount = (s.guardianUids || []).length;

    const card = document.createElement("div");
    card.className = "bg-white rounded-xl shadow-sm p-4";
    card.innerHTML = `
      <div class="flex items-center justify-between">
        <div>
          <p class="font-semibold text-gray-800">${escapeHtml(s.fullName || "Unnamed Student")}</p>
          <p class="text-sm text-gray-500">Grade ${escapeHtml(s.grade || "-")} · Section ${escapeHtml(s.section || "-")}</p>
        </div>
        <span class="text-xs px-2 py-1 rounded-full ${guardianCount > 0 ? "bg-green-100 text-green-700" : "bg-amber-100 text-amber-700"}">
          ${guardianCount} guardian${guardianCount === 1 ? "" : "s"}
        </span>
      </div>
      <a href="./register-parent.html?studentId=${encodeURIComponent(studentId)}"
         class="mt-3 block text-center py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-200">
        ${guardianCount > 0 ? "Register Another Guardian" : "Register Parent"}
      </a>
    `;
    list.appendChild(card);
  });
}

document.getElementById("addStudentForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const formError = document.getElementById("formError");
  formError.classList.add("hidden");

  const fullName = document.getElementById("studentName").value.trim();
  const grade = document.getElementById("studentGrade").value.trim();
  const section = document.getElementById("studentSection").value.trim();

  try {
    const res = await authedFetch("/teacher/students", {
      method: "POST",
      body: JSON.stringify({ fullName, grade, section }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not add student");

    e.target.reset();
    await loadStudents();

    // Jump straight into registering their parent — the natural next step
    // right after adding a new student to the roster.
    window.location.href = `./register-parent.html?studentId=${encodeURIComponent(data.studentId)}`;
  } catch (err) {
    formError.textContent = err.message;
    formError.classList.remove("hidden");
  }
});

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students — Pickup Pass</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <div class="max-w-sm mx-auto">
    <div id="schoolBanner" class="hidden items-center gap-2 mb-3 pt-2">
      <img id="schoolLogo" class="w-8 h-8 rounded object-contain bg-white border border-gray-200" />
      <span id="schoolName" class="text-sm font-medium text-gray-500"></span>
    </div>

    <div class="flex items-center justify-between mb-1">
      <h1 class="text-xl font-bold text-gray-800">Students</h1>
      <div class="flex items-center gap-3">
        <a href="./exit-logs.html" class="text-sm text-indigo-600 font-medium">History</a>
        <a href="./scanner.html" class="text-sm text-indigo-600 font-medium">Scanner →</a>
      </div>
    </div>
    <div class="flex items-center justify-between mb-3">
      <p id="currentUserEmail" class="text-xs text-gray-400"></p>
      <button id="signOutBtn" class="text-xs text-gray-400 underline">Sign out</button>
    </div>

    <input id="searchBox" type="text" placeholder="Search by name, grade, or section..."
      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />

    <div id="studentList" class="space-y-2 mb-6"></div>
    <div id="emptyState" class="hidden bg-white rounded-xl p-6 text-center text-sm text-gray-500 mb-6">
      No students yet — add your first one below.
    </div>
    <div id="noResultsState" class="hidden bg-white rounded-xl p-6 text-center text-sm text-gray-500 mb-6">
      No students match your search.
    </div>

    <div id="addStudentPanel" class="bg-white rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold text-gray-800 mb-3">Add a Student</h2>
      <form id="addStudentForm" class="space-y-2">
        <input id="lastName" type="text" required placeholder="Last name"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <input id="firstName" type="text" required placeholder="First name"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <div class="flex gap-2">
          <input id="middleInitial" type="text" maxlength="4" placeholder="M.I."
            class="w-1/3 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <input id="suffix" type="text" placeholder="Suffix (Jr., III...)"
            class="w-2/3 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="flex gap-2">
          <input id="studentGrade" type="text" placeholder="Grade"
            class="w-1/2 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <input id="studentSection" type="text" placeholder="Section"
            class="w-1/2 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <p id="formError" class="hidden" style="display: none"></p>

        <button id="addStudentBtn" type="submit"
          class="w-full py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition">
          Add Student
        </button>
      </form>
    </div>

    <div id="studentAddedPanel" class="hidden bg-green-50 border border-green-200 rounded-2xl p-4" role="status">
      <h2 class="font-semibold text-green-800">Student added successfully</h2>
      <p id="addedStudentName" class="text-sm text-green-700 mt-1"></p>
      <p class="text-sm text-green-700 mt-2">Would you like to register a parent or guardian now?</p>
      <button id="registerAddedStudentParentBtn" type="button"
        class="w-full mt-4 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition">
        Register Parent / Guardian
      </button>
      <button id="backToStudentListBtn" type="button"
        class="w-full mt-2 py-3 bg-white text-gray-700 border border-gray-300 rounded-lg font-semibold hover:bg-gray-50 transition">
        Back to Student List
      </button>
    </div>
  </div>

<script type="module">
import { auth, db, authedFetch, showToast } from "../shared/firebase-init.js";
import { collection, query, where, orderBy, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentSchoolId = null;
let allStudents = []; // cached so search filters client-side without re-querying
let isAddingStudent = false;
let addedStudentId = null;

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "../login.html";
});

document.getElementById("registerAddedStudentParentBtn").addEventListener("click", () => {
  if (!addedStudentId) return;
  sessionStorage.setItem("pendingParentStudentId", addedStudentId);
  window.location.href = `./register-parent.html?studentId=${encodeURIComponent(addedStudentId)}`;
});

document.getElementById("backToStudentListBtn").addEventListener("click", () => {
  document.getElementById("studentAddedPanel").classList.add("hidden");
  document.getElementById("addStudentPanel").classList.remove("hidden");
  document.getElementById("lastName").focus();
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
  // Deliberately prominent: on a shared/kiosk device, this is the one
  // thing that makes it obvious if you're accidentally still signed in
  // as the previous person rather than yourself.
  document.getElementById("currentUserEmail").textContent = user.email;
  const tokenResult = await user.getIdTokenResult();
  currentSchoolId = tokenResult.claims.schoolId;

  await loadSchoolBranding();
  await loadStudents();
});

async function loadSchoolBranding() {
  if (!currentSchoolId) return;
  const schoolSnap = await getDoc(doc(db, "schools", currentSchoolId));
  if (!schoolSnap.exists()) return;

  const school = schoolSnap.data();
  document.getElementById("schoolName").textContent = school.schoolName || "";
  if (school.logoUrl) {
    document.getElementById("schoolLogo").src = school.logoUrl;
  } else {
    document.getElementById("schoolLogo").remove();
  }
  document.getElementById("schoolBanner").classList.remove("hidden");
  document.getElementById("schoolBanner").classList.add("flex");
}

async function loadStudents() {
  // fullName is stored server-side as "Lastname, Firstname M. Suffix" (see
  // NameFormatter on the backend), so ordering by it here already sorts
  // last-name-first with no extra client-side logic needed.
  const q = query(
    collection(db, "students"),
    where("schoolId", "==", currentSchoolId),
    orderBy("fullName")
  );
  const snap = await getDocs(q);

  allStudents = snap.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));

  if (allStudents.length === 0) {
    document.getElementById("emptyState").classList.remove("hidden");
  }
  renderList(allStudents);
}

function renderList(students) {
  const list = document.getElementById("studentList");
  const noResultsState = document.getElementById("noResultsState");
  list.innerHTML = "";

  if (students.length === 0 && allStudents.length > 0) {
    noResultsState.classList.remove("hidden");
    return;
  }
  noResultsState.classList.add("hidden");

  students.forEach((s) => {
    const guardianCount = (s.guardianUids || []).length;

    const card = document.createElement("div");
    card.className = "bg-white rounded-xl shadow-sm p-4";
    card.innerHTML = `
      <div class="flex items-center justify-between">
        <div>
          <p class="font-semibold text-gray-800">${escapeHtml(s.fullName || "Unnamed Student")}</p>
          <p class="text-sm text-gray-500">Grade ${escapeHtml(s.grade || "-")} · Section ${escapeHtml(s.section || "-")}</p>
        </div>
        <span class="text-xs px-2 py-1 rounded-full ${guardianCount > 0 ? "bg-green-100 text-green-700" : "bg-amber-100 text-amber-700"}">
          ${guardianCount} guardian${guardianCount === 1 ? "" : "s"}
        </span>
      </div>
      <a href="${guardianCount > 0 ? `./manage-guardians.html?studentId=${encodeURIComponent(s.id)}` : `./register-parent.html?studentId=${encodeURIComponent(s.id)}`}"
         class="student-action-link mt-3 block text-center py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-200">
        ${guardianCount > 0 ? "Manage Guardians" : "Register Parent"}
      </a>
    `;
    card.querySelector(".student-action-link").addEventListener("click", () => {
      sessionStorage.setItem(
        guardianCount > 0 ? "pendingStaffGuardianStudentId" : "pendingParentStudentId",
        s.id
      );
    });
    list.appendChild(card);
  });
}

document.getElementById("searchBox").addEventListener("input", (e) => {
  const term = e.target.value.trim().toLowerCase();
  if (!term) {
    renderList(allStudents);
    return;
  }
  const filtered = allStudents.filter((s) =>
    (s.fullName || "").toLowerCase().includes(term) ||
    (s.grade || "").toLowerCase().includes(term) ||
    (s.section || "").toLowerCase().includes(term)
  );
  renderList(filtered);
});

document.getElementById("addStudentForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (isAddingStudent) return;

  const formError = document.getElementById("formError");
  const submitButton = document.getElementById("addStudentBtn");
  formError.classList.add("hidden");
  isAddingStudent = true;
  submitButton.disabled = true;
  submitButton.textContent = "Adding student...";
  submitButton.classList.add("opacity-60", "cursor-not-allowed");

  const lastName = document.getElementById("lastName").value.trim();
  const firstName = document.getElementById("firstName").value.trim();
  const middleInitial = document.getElementById("middleInitial").value.trim();
  const suffix = document.getElementById("suffix").value.trim();
  const grade = document.getElementById("studentGrade").value.trim();
  const section = document.getElementById("studentSection").value.trim();

  try {
    const res = await authedFetch("/teacher/students", {
      method: "POST",
      body: JSON.stringify({ lastName, firstName, middleInitial, suffix, grade, section }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not add student");

    await loadStudents();
    e.target.reset();
    addedStudentId = data.studentId;
    document.getElementById("addedStudentName").textContent = data.fullName;
    document.getElementById("addStudentPanel").classList.add("hidden");
    document.getElementById("studentAddedPanel").classList.remove("hidden");
    showToast(`${data.fullName} was added. You can register a parent or guardian next.`, "success");

    // Jump straight into registering their parent — the natural next step
    // right after adding a new student to the roster.
    sessionStorage.setItem("pendingParentStudentId", data.studentId);
  } catch (err) {
    formError.textContent = err.message;
    formError.classList.remove("hidden");
    showToast(err.message || "Could not add student.", "error");
  } finally {
    // Successful submissions navigate to the parent-registration page. If
    // the request fails, restore the form so the user can correct and retry.
    isAddingStudent = false;
    submitButton.disabled = false;
    submitButton.textContent = "Add Student";
    submitButton.classList.remove("opacity-60", "cursor-not-allowed");
  }
});

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

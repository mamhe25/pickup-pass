<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/portal.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen pp-portal-body">

  <div id="teacherNav" data-active="students"></div>
  <script type="module" src="../shared/teacher-nav.js"></script>

  <main class="pp-page pp-page--narrow">
    <h1 class="text-xl font-bold text-ink-strong mb-3">Students</h1>

    <input id="searchBox" type="text" placeholder="Search by name, grade, or section..."
      class="pp-field mb-3" />

    <div id="studentList" class="space-y-2 mb-6"></div>
    <div id="emptyState" class="pp-empty hidden mb-6">
      No students yet — add your first one below.
    </div>
    <div id="noResultsState" class="pp-empty hidden mb-6">
      No students found.
    </div>
    <div id="noSectionsState" class="pp-empty hidden mb-6">
      No sections assigned yet — ask your school admin to assign you a grade and section.
    </div>

    <div id="addStudentPanel" class="pp-card pp-card--pad">
      <h2 class="font-semibold text-ink-strong mb-3">Add a Student</h2>
      <form id="addStudentForm" class="space-y-2">
        <input id="lastName" type="text" required placeholder="Last name" class="pp-field" />
        <input id="firstName" type="text" required placeholder="First name" class="pp-field" />
        <div class="flex gap-2">
          <input id="middleInitial" type="text" maxlength="4" placeholder="M.I." class="pp-field w-1/3" />
          <input id="suffix" type="text" placeholder="Suffix (Jr., III...)" class="pp-field w-2/3" />
        </div>
        <div class="flex gap-2">
          <input id="studentGrade" type="text" placeholder="Grade" class="pp-field w-1/2" />
          <input id="studentSection" type="text" placeholder="Section" class="pp-field w-1/2" />
        </div>

        <p id="formError" class="hidden" style="display: none"></p>

        <button id="addStudentBtn" type="submit" class="pp-btn pp-btn--primary w-full">
          Add Student
        </button>
      </form>
    </div>

    <div id="studentAddedPanel" class="pp-alert pp-alert--success hidden flex-col" role="status">
      <h2 class="font-semibold">Student added successfully</h2>
      <p id="addedStudentName" class="text-sm mt-1"></p>
      <p class="text-sm mt-2">Would you like to register a parent or guardian now?</p>
      <button id="registerAddedStudentParentBtn" type="button"
        class="pp-btn pp-btn--primary w-full mt-4">
        Register Parent / Guardian
      </button>
      <button id="backToStudentListBtn" type="button"
        class="pp-btn pp-btn--secondary w-full mt-2">
        Back to Student List
      </button>
    </div>
  </main>

<script type="module">
import { auth, db, authedFetch, showToast } from "../shared/firebase-init.js";
import { collection, query, where, orderBy, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentSchoolId = null;
let currentRole = null;
let allStudents = []; // cached so search filters client-side without re-querying
let isAddingStudent = false;
let addedStudentId = null;

document.getElementById("registerAddedStudentParentBtn").addEventListener("click", () => {
  if (!addedStudentId) return;
  sessionStorage.setItem("pendingParentStudentId", addedStudentId);
  window.location.href = `./register-parent.html?studentId=${encodeURIComponent(addedStudentId)}`;
});

document.getElementById("backToStudentListBtn").addEventListener("click", () => {
  document.getElementById("studentAddedPanel").classList.add("hidden");
  document.getElementById("addStudentPanel").classList.remove("hidden");
  document.getElementById("lastName").focus();
});

onAuthStateChanged(auth, async (user) => {
  if (!user) return; // the shared teacher nav performs the redirect
  const tokenResult = await user.getIdTokenResult();
  currentSchoolId = tokenResult.claims.schoolId;
  currentRole = tokenResult.claims.role;

  // School logo + name are shown persistently in the shared nav app-bar now,
  // so this page no longer loads its own school banner.
  await loadStudents();
});

async function loadStudents() {
  document.getElementById("noSectionsState").classList.add("hidden");

  if (currentRole === "teacher") {
    const mySections = await getMyAssignedSections();
    if (mySections.length === 0) {
      allStudents = [];
      document.getElementById("noSectionsState").classList.remove("hidden");
      document.getElementById("studentList").innerHTML = "";
      return;
    }
    allStudents = await getStudentsForSections(mySections);
  } else {
    // School admin: unrestricted, whole-school roster — unchanged from before.
    // fullName is stored server-side as "Lastname, Firstname M. Suffix" (see
    // NameFormatter on the backend), so ordering by it here already sorts
    // last-name-first with no extra client-side logic needed.
    const q = query(
      collection(db, "students"),
      where("schoolId", "==", currentSchoolId),
      orderBy("fullName")
    );
    const snap = await getDocs(q);
    allStudents = snap.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));
  }

  if (allStudents.length === 0) {
    document.getElementById("emptyState").classList.remove("hidden");
  } else {
    document.getElementById("emptyState").classList.add("hidden");
  }
  renderList(allStudents);
}

/**
 * A teacher's own assigned sections, read directly from their own
 * users/{uid} Firestore doc — the same field BroadcastService reads
 * server-side to scope "announce to my section." Self-reads are already
 * permitted by the existing security rules, so no new backend endpoint
 * is needed just to see your own assignment.
 */
async function getMyAssignedSections() {
  const uid = auth.currentUser.uid;
  const snap = await getDoc(doc(db, "users", uid));
  if (!snap.exists()) return [];
  return snap.data().assignedSections || [];
}

/**
 * Roster scoped to only the given grade/section pairs. Firestore has no
 * clean "match any of these (grade, section) pairs" in one query without a
 * computed composite field (which would need a one-time migration to
 * backfill every existing student doc) — since a teacher's assigned
 * sections list is always small, one query per pair merged in memory is
 * simpler. Same reasoning already used for the Android app and for
 * BroadcastService's section-targeting on the backend.
 */
async function getStudentsForSections(sections) {
  const results = [];
  const seenIds = new Set();

  for (const s of sections) {
    const q = query(
      collection(db, "students"),
      where("schoolId", "==", currentSchoolId),
      where("grade", "==", s.grade),
      where("section", "==", s.section)
    );
    const snap = await getDocs(q);
    snap.docs.forEach((docSnap) => {
      if (!seenIds.has(docSnap.id)) {
        seenIds.add(docSnap.id);
        results.push({ id: docSnap.id, ...docSnap.data() });
      }
    });
  }

  results.sort((a, b) => (a.fullName || "").localeCompare(b.fullName || ""));
  return results;
}

/**
 * Grade labels are free text ("1", "10", "K"), so a plain string sort
 * would put "10" before "2". Extract leading digits when present and sort
 * numerically; non-numeric labels sort after all numeric grades.
 */
function gradeCompare(a, b) {
  const na = parseInt((a || "").replace(/\D/g, ""), 10);
  const nb = parseInt((b || "").replace(/\D/g, ""), 10);
  const aIsNum = !Number.isNaN(na);
  const bIsNum = !Number.isNaN(nb);
  if (aIsNum && bIsNum) return na - nb;
  if (aIsNum) return -1;
  if (bIsNum) return 1;
  return (a || "").localeCompare(b || "");
}

function groupStudents(students) {
  const byGrade = new Map();
  students.forEach((s) => {
    const grade = s.grade || "-";
    const section = s.section || "-";
    if (!byGrade.has(grade)) byGrade.set(grade, new Map());
    const bySection = byGrade.get(grade);
    if (!bySection.has(section)) bySection.set(section, []);
    bySection.get(section).push(s);
  });

  return [...byGrade.keys()]
    .sort(gradeCompare)
    .map((grade) => ({
      grade,
      sections: [...byGrade.get(grade).keys()]
        .sort()
        .map((section) => ({
          section,
          students: byGrade.get(grade).get(section).sort((a, b) => (a.fullName || "").localeCompare(b.fullName || "")),
        })),
    }));
}

function renderList(students) {
  const list = document.getElementById("studentList");
  const noResultsState = document.getElementById("noResultsState");
  list.innerHTML = "";

  if (students.length === 0) {
    noResultsState.classList.toggle("hidden", allStudents.length === 0);
    return;
  }
  noResultsState.classList.add("hidden");

  const groups = groupStudents(students);

  groups.forEach((gradeGroup) => {
    const gradeHeader = document.createElement("h2");
    gradeHeader.className = "text-lg font-bold text-ink-strong mt-4 mb-1";
    gradeHeader.textContent = `Grade ${gradeGroup.grade}`;
    list.appendChild(gradeHeader);

    gradeGroup.sections.forEach((sectionGroup) => {
      const sectionHeader = document.createElement("h3");
      sectionHeader.className = "text-sm font-semibold text-ink-muted mb-2 ml-1";
      sectionHeader.textContent = `Section ${sectionGroup.section}`;
      list.appendChild(sectionHeader);

      sectionGroup.students.forEach((s) => {
        list.appendChild(renderStudentCard(s));
      });
    });
  });
}

function renderStudentCard(s) {
  const guardianCount = (s.guardianUids || []).length;

  const card = document.createElement("div");
  card.className = "pp-card pp-card--pad mb-2";
  card.innerHTML = `
    <div class="flex items-center justify-between">
      <div>
        <p class="font-semibold text-ink-strong">${escapeHtml(s.fullName || "Unnamed Student")}</p>
        <p class="text-sm text-ink-muted">Grade ${escapeHtml(s.grade || "-")} · Section ${escapeHtml(s.section || "-")}</p>
      </div>
      <span class="pp-badge ${guardianCount > 0 ? "pp-badge--success" : "pp-badge--warning"}">
        ${guardianCount} guardian${guardianCount === 1 ? "" : "s"}
      </span>
    </div>
    <a href="${guardianCount > 0 ? `./manage-guardians.html?studentId=${encodeURIComponent(s.id)}` : `./register-parent.html?studentId=${encodeURIComponent(s.id)}`}"
       class="student-action-link pp-btn pp-btn--secondary w-full mt-3">
      ${guardianCount > 0 ? "Manage Guardians" : "Register Parent"}
    </a>
  `;
  card.querySelector(".student-action-link").addEventListener("click", () => {
    sessionStorage.setItem(
      guardianCount > 0 ? "pendingStaffGuardianStudentId" : "pendingParentStudentId",
      s.id
    );
  });
  return card;
}

document.getElementById("searchBox").addEventListener("input", (e) => {
  const term = e.target.value.trim().toLowerCase();
  if (!term) {
    renderList(allStudents);
    return;
  }
  const filtered = allStudents.filter((s) =>
    (s.fullName || "").toLowerCase().includes(term) ||
    (s.grade || "").toLowerCase().includes(term) ||
    (s.section || "").toLowerCase().includes(term)
  );
  renderList(filtered);
});

document.getElementById("addStudentForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (isAddingStudent) return;

  const formError = document.getElementById("formError");
  const submitButton = document.getElementById("addStudentBtn");
  formError.classList.add("hidden");
  isAddingStudent = true;
  submitButton.disabled = true;
  submitButton.textContent = "Adding student...";
  submitButton.classList.add("opacity-60", "cursor-not-allowed");

  const lastName = document.getElementById("lastName").value.trim();
  const firstName = document.getElementById("firstName").value.trim();
  const middleInitial = document.getElementById("middleInitial").value.trim();
  const suffix = document.getElementById("suffix").value.trim();
  const grade = document.getElementById("studentGrade").value.trim();
  const section = document.getElementById("studentSection").value.trim();

  try {
    const res = await authedFetch("/teacher/students", {
      method: "POST",
      body: JSON.stringify({ lastName, firstName, middleInitial, suffix, grade, section }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not add student");

    await loadStudents();
    e.target.reset();
    addedStudentId = data.studentId;
    document.getElementById("addedStudentName").textContent = data.fullName;
    document.getElementById("addStudentPanel").classList.add("hidden");
    document.getElementById("studentAddedPanel").classList.remove("hidden");
    showToast(`${data.fullName} was added. You can register a parent or guardian next.`, "success");

    // Jump straight into registering their parent — the natural next step
    // right after adding a new student to the roster.
    sessionStorage.setItem("pendingParentStudentId", data.studentId);
  } catch (err) {
    formError.textContent = err.message;
    formError.classList.remove("hidden");
    showToast(err.message || "Could not add student.", "error");
  } finally {
    // Successful submissions navigate to the parent-registration page. If
    // the request fails, restore the form so the user can correct and retry.
    isAddingStudent = false;
    submitButton.disabled = false;
    submitButton.textContent = "Add Student";
    submitButton.classList.remove("opacity-60", "cursor-not-allowed");
  }
});

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

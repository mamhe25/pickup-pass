<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications — Pickup Pass</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <div class="max-w-sm mx-auto">
    <div class="flex items-center justify-between pt-2 mb-1">
      <a href="./students.html" class="text-sm text-indigo-600 font-medium">← My Students</a>
    </div>
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold text-gray-800">Notifications</h1>
      <button id="markAllReadBtn" class="text-xs text-indigo-600 font-medium hidden">Mark all read</button>
    </div>

    <div id="notificationList" class="space-y-2"></div>
    <div id="emptyState" class="hidden bg-white rounded-xl p-6 text-center text-sm text-gray-500">
      No notifications yet. You'll see pickup confirmations here.
    </div>
    <div id="loadingState" class="text-center text-sm text-gray-400 py-6">Loading…</div>
  </div>

<script type="module">
import { auth, db } from "../shared/firebase-init.js";
import { collection, query, where, orderBy, limit, getDocs, doc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentUid = null;
let allNotifications = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
  currentUid = user.uid;
  await loadNotifications();
});

async function loadNotifications() {
  const loadingState = document.getElementById("loadingState");
  loadingState.classList.remove("hidden");

  const q = query(
    collection(db, "notifications"),
    where("recipientUid", "==", currentUid),
    orderBy("createdAt", "desc"),
    limit(100)
  );
  const snap = await getDocs(q);

  allNotifications = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  loadingState.classList.add("hidden");

  if (allNotifications.length === 0) {
    document.getElementById("emptyState").classList.remove("hidden");
    return;
  }

  render();
}

function render() {
  const list = document.getElementById("notificationList");
  list.innerHTML = "";

  const hasUnread = allNotifications.some((n) => !n.read);
  document.getElementById("markAllReadBtn").classList.toggle("hidden", !hasUnread);

  allNotifications.forEach((n) => {
    const card = document.createElement("button");
    card.className = `w-full text-left rounded-xl p-4 shadow-sm transition ${
      n.read ? "bg-white" : "bg-indigo-50 border border-indigo-200"
    }`;
    card.innerHTML = `
      <div class="flex items-start justify-between gap-2">
        <p class="font-semibold text-gray-800 text-sm">${escapeHtml(n.title || "Notification")}</p>
        ${!n.read ? '<span class="w-2 h-2 rounded-full bg-indigo-600 mt-1.5 flex-shrink-0"></span>' : ""}
      </div>
      <p class="text-sm text-gray-600 mt-1">${escapeHtml(n.body || "")}</p>
      <p class="text-xs text-gray-400 mt-2">${n.createdAt?.toDate ? formatTime(n.createdAt.toDate()) : ""}</p>
    `;
    card.addEventListener("click", () => markAsRead(n));
    list.appendChild(card);
  });
}

async function markAsRead(notification) {
  if (notification.read) return;
  notification.read = true; // optimistic update
  render();
  try {
    await updateDoc(doc(db, "notifications", notification.id), { read: true });
  } catch (err) {
    notification.read = false; // revert on failure
    render();
  }
}

document.getElementById("markAllReadBtn").addEventListener("click", async () => {
  const unread = allNotifications.filter((n) => !n.read);
  if (unread.length === 0) return;

  unread.forEach((n) => { n.read = true; }); // optimistic
  render();

  const batch = writeBatch(db);
  unread.forEach((n) => batch.update(doc(db, "notifications", n.id), { read: true }));
  try {
    await batch.commit();
  } catch (err) {
    await loadNotifications(); // fall back to a fresh reload on failure
  }
});

function formatTime(date) {
  return date.toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

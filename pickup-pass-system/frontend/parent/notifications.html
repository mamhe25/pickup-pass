<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen">

  <div id="parentNav" data-active="notifications"></div>
  <script type="module" src="../shared/parent-nav.js"></script>

  <main class="max-w-lg mx-auto p-4">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold text-ink-strong">Notifications</h1>
      <button id="markAllReadBtn" class="pp-btn pp-btn--ghost hidden">Mark all read</button>
    </div>

    <div id="notificationList" class="space-y-2"></div>
    <div id="emptyState" class="pp-empty hidden">
      No notifications yet. You'll see pickup confirmations here.
    </div>
    <div id="loadingState" class="text-center text-sm text-ink-subtle py-6">Loading…</div>
  </main>

<script type="module">
import { auth, db } from "../shared/firebase-init.js";
import { collection, query, where, orderBy, limit, getDocs, doc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentUid = null;
let allNotifications = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
  currentUid = user.uid;
  await loadNotifications();
});

async function loadNotifications() {
  const loadingState = document.getElementById("loadingState");
  loadingState.classList.remove("hidden");

  const q = query(
    collection(db, "notifications"),
    where("recipientUid", "==", currentUid),
    orderBy("createdAt", "desc"),
    limit(100)
  );
  const snap = await getDocs(q);

  allNotifications = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  loadingState.classList.add("hidden");

  if (allNotifications.length === 0) {
    document.getElementById("emptyState").classList.remove("hidden");
    return;
  }

  render();
}

function render() {
  const list = document.getElementById("notificationList");
  list.innerHTML = "";

  const hasUnread = allNotifications.some((n) => !n.read);
  document.getElementById("markAllReadBtn").classList.toggle("hidden", !hasUnread);

  allNotifications.forEach((n) => {
    const card = document.createElement("button");
    card.className = `pp-card pp-card--pad pp-card--interactive w-full text-left ${
      n.read ? "" : "!border-brand-600"
    }`;
    if (!n.read) card.style.backgroundColor = "var(--primary-container)";
    card.innerHTML = `
      <div class="flex items-start justify-between gap-2">
        <p class="font-semibold text-ink-strong text-sm">${escapeHtml(n.title || "Notification")}</p>
        ${!n.read ? '<span class="pp-dot pp-dot--brand mt-1.5"></span>' : ""}
      </div>
      <p class="text-sm text-ink-muted mt-1">${escapeHtml(n.body || "")}</p>
      ${n.type === "broadcast" && n.senderName ? `<p class="text-xs text-brand-600 mt-1">From: ${escapeHtml(n.senderName)}</p>` : ""}
      <p class="text-xs text-ink-subtle mt-2">${n.createdAt?.toDate ? formatTime(n.createdAt.toDate()) : ""}</p>
    `;
    card.addEventListener("click", () => markAsRead(n));
    list.appendChild(card);
  });
}

async function markAsRead(notification) {
  if (notification.read) return;
  notification.read = true; // optimistic update
  render();
  try {
    await updateDoc(doc(db, "notifications", notification.id), { read: true });
  } catch (err) {
    notification.read = false; // revert on failure
    render();
  }
}

document.getElementById("markAllReadBtn").addEventListener("click", async () => {
  const unread = allNotifications.filter((n) => !n.read);
  if (unread.length === 0) return;

  unread.forEach((n) => { n.read = true; }); // optimistic
  render();

  const batch = writeBatch(db);
  unread.forEach((n) => batch.update(doc(db, "notifications", n.id), { read: true }));
  try {
    await batch.commit();
  } catch (err) {
    await loadNotifications(); // fall back to a fresh reload on failure
  }
});

function formatTime(date) {
  return date.toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

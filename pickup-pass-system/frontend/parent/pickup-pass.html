<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pickup Pass — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/portal.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="min-h-screen pp-portal-body">

  <div id="parentNav" data-active="students"></div>
  <script type="module" src="../shared/parent-nav.js"></script>

  <main class="pp-page pp-page--compact">
    <a href="./students.html" class="pp-backlink mb-3">← My Students</a>

    <!-- The pass: a calm, reassuring hero. The brand gradient header is the one
         moment of colour; the QR itself sits on a clean white field so it scans
         reliably under any lighting at the gate. -->
    <div class="pp-card pp-card--elevated overflow-hidden text-center">
      <div class="pp-brand-surface px-6 pt-6 pb-5">
        <div class="inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-white/80">
          <span class="pp-dot" style="background-color:#fff;"></span>Secure Pickup Pass
        </div>
        <h1 class="text-lg font-bold mt-2">Show this to school staff</h1>
        <p id="studentLabel" class="text-sm text-white/85 mt-0.5"></p>
      </div>

      <div class="p-6">
        <div id="qrContainer" class="flex justify-center my-2 min-h-[344px] items-center">
          <span class="text-ink-subtle text-sm">Generating pass…</span>
        </div>

        <p id="countdown" class="text-sm font-medium text-ink-muted mt-3"></p>
        <p id="errorMsg" class="pp-alert pp-alert--danger mt-3 hidden"></p>

        <button id="refreshBtn" class="pp-btn pp-btn--primary w-full mt-4">
          Regenerate Pass
        </button>
        <p class="text-xs text-ink-subtle mt-3">
          This pass refreshes for your security. Staff verify your photo before releasing your child.
        </p>
      </div>
    </div>
  </main>

<script type="module">
import { auth, authedFetch, db } from "../shared/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// studentId must come from the student picker (students.html) — no demo fallback,
// since a parent may have more than one linked child.
const params = new URLSearchParams(window.location.search);
const studentId = params.get("studentId") || sessionStorage.getItem("pickupPassStudentId");

if (!studentId) {
  window.location.href = "./students.html";
}

let countdownTimer = null;

// Sign-out, the auth guard and the signed-in email are owned by the shared
// parent nav. This page keeps its auth listener to load the student + render
// the pass once we know who's signed in.
onAuthStateChanged(auth, async (user) => {
  if (!user) return; // nav performs the redirect
  const studentSnap = await getDoc(doc(db, "students", studentId));
  if (studentSnap.exists()) {
    document.getElementById("studentLabel").textContent = studentSnap.data().fullName || "";
  }
  renderPass();
});

async function generatePickupToken() {
  const res = await authedFetch("/parent/generate-token", {
    method: "POST",
    body: JSON.stringify({ studentId }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || "Could not generate pass");
  }
  return res.json(); // { qrToken, expiresAt, dismissalDeadline }
}

async function renderPass() {
  const container = document.getElementById("qrContainer");
  const errorMsg = document.getElementById("errorMsg");
  errorMsg.classList.add("hidden");
  container.innerHTML = '<span class="text-ink-subtle text-sm">Generating pass…</span>';

  try {
    const { qrToken, expiresAt } = await generatePickupToken();

    container.innerHTML = "";
    const qrBox = document.createElement("div");
    qrBox.style.background = "#ffffff";
    qrBox.style.padding = "12px";
    qrBox.style.borderRadius = "12px";
    qrBox.style.display = "inline-block";

    container.appendChild(qrBox);

    new QRCode(qrBox, {
      text: qrToken,
      width: 320,
      height: 320,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    startCountdown(new Date(expiresAt));
  } catch (err) {
    container.innerHTML = "";
    errorMsg.textContent = err.message;
    errorMsg.classList.remove("hidden");
  }
}

function startCountdown(expiresAt) {
  clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    const msLeft = expiresAt.getTime() - Date.now();
    if (msLeft <= 0) {
      document.getElementById("countdown").textContent = "Expired — tap Regenerate";
      clearInterval(countdownTimer);
      return;
    }
    const mins = Math.floor(msLeft / 60000);
    const secs = Math.floor((msLeft % 60000) / 1000);
    document.getElementById("countdown").textContent = `Expires in ${mins}m ${secs}s`;
  }, 1000);
}

document.getElementById("refreshBtn").addEventListener("click", renderPass);
</script>
</body>
</html>

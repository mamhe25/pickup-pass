<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Guardians — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen">

  <div id="parentNav" data-active="students"></div>
  <script type="module" src="../shared/parent-nav.js"></script>

  <main class="max-w-lg mx-auto p-4">
    <a href="./students.html" class="pp-backlink mb-3">← My Students</a>

    <h1 class="text-xl font-bold text-ink-strong mb-1">Authorized Pickup Guardians</h1>
    <p id="studentLabel" class="text-sm text-ink-muted mb-4"></p>

    <div id="guardianList" class="space-y-2 mb-6"></div>

    <div class="pp-card pp-card--pad">
      <h2 class="font-semibold text-ink-strong mb-2">Add a Backup Guardian</h2>
      <p class="text-sm text-ink-muted mb-3">
        Add someone else who's allowed to pick up this student if you're unavailable —
        a spouse, grandparent, or other trusted adult. They'll get an email to set up their own account and photo.
      </p>

      <form id="addForm" class="space-y-2">
        <input id="lastName" type="text" required placeholder="Last name" class="pp-field" />
        <input id="firstName" type="text" required placeholder="First name" class="pp-field" />
        <div class="flex gap-2">
          <input id="middleInitial" type="text" maxlength="4" placeholder="M.I." class="pp-field w-1/3" />
          <input id="suffix" type="text" placeholder="Suffix (Jr., III...)" class="pp-field w-2/3" />
        </div>
        <input id="guardianEmail" type="email" required placeholder="Email address" class="pp-field" />
        <select id="guardianRelationship" class="pp-field">
          <option value="parent/guardian">Parent / Guardian</option>
          <option value="grandparent">Grandparent</option>
          <option value="relative">Other Relative</option>
          <option value="caregiver">Caregiver / Nanny</option>
          <option value="authorized pickup">Other Authorized Pickup</option>
        </select>

        <p id="formError" class="pp-alert pp-alert--danger hidden" style="display: none"></p>
        <p id="formSuccess" class="pp-alert pp-alert--success hidden" style="display: none"></p>

        <button type="submit" class="pp-btn pp-btn--primary w-full">
          Add Guardian
        </button>
      </form>
    </div>
  </main>

<script type="module">
import { auth, db, authedFetch, setSubmitButtonBusy, showToast } from "../shared/firebase-init.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const params = new URLSearchParams(window.location.search);
const studentId = params.get("studentId") || sessionStorage.getItem("pendingGuardianStudentId");

if (!studentId) {
  window.location.href = "./students.html";
}

let currentUid = null;

// Sign-out, auth guard and signed-in email are owned by the shared parent nav.
// This page keeps its auth listener only to load the student's guardians.
onAuthStateChanged(auth, async (user) => {
  if (!user) return; // nav performs the redirect
  currentUid = user.uid;
  await renderGuardians();
});

async function renderGuardians() {
  const studentSnap = await getDoc(doc(db, "students", studentId));
  if (!studentSnap.exists()) {
    document.getElementById("studentLabel").textContent = "Student not found.";
    return;
  }

  const student = studentSnap.data();
  document.getElementById("studentLabel").textContent =
    `${student.fullName} · Grade ${student.grade}`;

  const guardians = student.guardians || {};
  const list = document.getElementById("guardianList");
  list.innerHTML = "";

  const uids = Object.keys(guardians);
  if (uids.length === 0) {
    list.innerHTML = '<div class="pp-empty">No guardians on record.</div>';
    return;
  }

  let profileMap = {};
  try {
    const profileRes = await authedFetch(`/parent/students/${encodeURIComponent(studentId)}/guardian-profiles`);
    if (profileRes.ok) {
      const profileBody = await profileRes.json();
      profileMap = Object.fromEntries((profileBody.guardians || []).map((p) => [p.uid, p]));
    }
  } catch (_) {
    // Relationship/primary status can still render if profile summaries fail.
  }

  for (const uid of uids) {
    const entry = guardians[uid];
    const userData = profileMap[uid] || {};

    const row = document.createElement("div");
    row.className = "pp-card pp-card--pad flex items-center gap-3";
    row.innerHTML = `
      <img src="${userData.photoUrl || '../assets/default-avatar.png'}"
           class="w-12 h-12 rounded-full object-cover border border-hairline" />
      <div class="flex-1 min-w-0">
        <p class="font-medium text-ink-strong truncate flex items-center gap-1">
          ${escapeHtml(userData.displayName || "Pending guardian")}
          ${entry.isPrimary ? '<span class="pp-badge pp-badge--brand">Primary</span>' : ""}
        </p>
        <p class="text-xs text-ink-muted truncate">${escapeHtml(entry.relationship || "")}</p>
      </div>
      ${entry.isPrimary ? "" : `<button data-uid="${uid}" class="removeBtn pp-btn pp-btn--ghost !text-danger">Remove</button>`}
    `;
    list.appendChild(row);
  }

  document.querySelectorAll(".removeBtn").forEach((btn) => {
    btn.addEventListener("click", () => removeGuardian(btn.dataset.uid, btn));
  });
}

async function removeGuardian(guardianUid, removeButton) {
  if (!confirm("Remove this person as an authorized pickup guardian? Any pass they're currently holding will stop working immediately.")) {
    return;
  }
  setSubmitButtonBusy(removeButton, true, "Removing…");
  try {
    const res = await authedFetch("/parent/remove-guardian", {
      method: "POST",
      body: JSON.stringify({ studentId, guardianUid }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not remove guardian");
    await renderGuardians();
    showToast("Guardian removed successfully.", "success");
  } catch (err) {
    showToast(err.message || "Could not remove guardian.", "error");
  } finally {
    setSubmitButtonBusy(removeButton, false);
  }
}

document.getElementById("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitButton = e.currentTarget.querySelector('button[type="submit"]');
  if (submitButton.disabled) return;
  setSubmitButtonBusy(submitButton, true, "Adding guardian…");
  const formError = document.getElementById("formError");
  const formSuccess = document.getElementById("formSuccess");
  formError.classList.add("hidden");
  formSuccess.classList.add("hidden");

  const lastName = document.getElementById("lastName").value.trim();
  const firstName = document.getElementById("firstName").value.trim();
  const middleInitial = document.getElementById("middleInitial").value.trim();
  const suffix = document.getElementById("suffix").value.trim();
  const guardianEmail = document.getElementById("guardianEmail").value.trim();
  const relationship = document.getElementById("guardianRelationship").value;

  try {
    const res = await authedFetch("/parent/add-guardian", {
      method: "POST",
      body: JSON.stringify({ studentId, lastName, firstName, middleInitial, suffix, guardianEmail, relationship }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not add guardian");

    if (data.status === "linked_existing") {
      formSuccess.textContent = "Added — this person already had an account.";
    } else if (data.emailSent) {
      formSuccess.textContent = "Added! They'll receive an email to set up their account.";
    } else {
      formSuccess.textContent = "Added, but the invite email couldn't be sent — ask them to use \"Forgot password?\" on the sign-in page with their email.";
    }
    formSuccess.classList.remove("hidden");
    showToast(formSuccess.textContent, data.emailSent === false ? "warning" : "success");
    e.target.reset();
    await renderGuardians();
  } catch (err) {
    formError.textContent = err.message;
    formError.classList.remove("hidden");
    showToast(err.message || "Could not add guardian.", "error");
  } finally {
    setSubmitButtonBusy(submitButton, false);
  }
});

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

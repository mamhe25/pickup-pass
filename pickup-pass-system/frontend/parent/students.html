<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Students — Pickup Pass</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <div class="max-w-sm mx-auto">
    <div id="schoolBanner" class="hidden items-center gap-2 mb-3 pt-2">
      <img id="schoolLogo" class="w-8 h-8 rounded object-contain bg-white border border-gray-200" />
      <span id="schoolName" class="text-sm font-medium text-gray-500"></span>
    </div>

    <div class="flex items-center justify-between mb-1">
      <h1 class="text-xl font-bold text-gray-800">My Students</h1>
      <div class="flex items-center gap-3">
        <a href="./notifications.html" class="relative" aria-label="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span id="unreadBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center"></span>
        </a>
        <a href="./profile.html" class="text-sm text-indigo-600 font-medium">My Profile</a>
      </div>
    </div>
    <div class="flex items-center justify-between mb-4">
      <p id="currentUserEmail" class="text-xs text-gray-400"></p>
      <button id="signOutBtn" class="text-xs text-gray-400 underline">Sign out</button>
    </div>

    <div id="studentList"></div>
    <div id="emptyState" class="hidden bg-white rounded-xl p-6 text-center text-sm text-gray-500">
      No students are linked to your account yet. Contact your school office to be
      added as a pickup contact.
    </div>
  </div>

<script type="module">
import { auth, db } from "../shared/firebase-init.js";
import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "../login.html";
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
  // Deliberately prominent: on a shared/kiosk device, this is the one
  // thing that makes it obvious if you're accidentally still signed in
  // as the previous parent rather than yourself.
  document.getElementById("currentUserEmail").textContent = user.email;
  const tokenResult = await user.getIdTokenResult();
  const schoolId = tokenResult.claims.schoolId;
  await loadSchoolBranding(schoolId);
  await loadStudents(user.uid, schoolId);
  await loadUnreadCount(user.uid);
});

async function loadUnreadCount(uid) {
  // Firestore has no server-side COUNT-with-filter in the compat/v9 client
  // without a separate aggregation call; for an inbox this size (a
  // school's worth of pickup notifications for one guardian), fetching
  // the unread docs directly and counting client-side is simpler and
  // cheap enough rather than adding a getCountFromServer() call.
  const q = query(
    collection(db, "notifications"),
    where("recipientUid", "==", uid),
    where("read", "==", false)
  );
  const snap = await getDocs(q);
  const badge = document.getElementById("unreadBadge");
  if (snap.size > 0) {
    badge.textContent = snap.size > 9 ? "9+" : String(snap.size);
    badge.classList.remove("hidden");
  }
}

async function loadSchoolBranding(schoolId) {
  if (!schoolId) return;
  const schoolSnap = await getDoc(doc(db, "schools", schoolId));
  if (!schoolSnap.exists()) return;

  const school = schoolSnap.data();
  document.getElementById("schoolName").textContent = school.schoolName || "";
  if (school.logoUrl) {
    document.getElementById("schoolLogo").src = school.logoUrl;
  } else {
    document.getElementById("schoolLogo").remove();
  }
  document.getElementById("schoolBanner").classList.remove("hidden");
  document.getElementById("schoolBanner").classList.add("flex");
}

async function loadStudents(uid, schoolId) {
  const list = document.getElementById("studentList");
  const q = query(
    collection(db, "students"),
    where("schoolId", "==", schoolId),
    where("guardianUids", "array-contains", uid)
  );

  const snap = await getDocs(q);

  if (snap.empty) {
    document.getElementById("emptyState").classList.remove("hidden");
    return;
  }

  snap.forEach((docSnap) => {
    const s = docSnap.data();
    const studentId = docSnap.id;

    const card = document.createElement("div");
    card.className = "bg-white rounded-xl shadow-sm p-4 mb-3";
    card.innerHTML = `
      <p class="font-semibold text-gray-800">${escapeHtml(s.fullName || "Unnamed Student")}</p>
      <p class="text-sm text-gray-500 mb-3">Grade ${escapeHtml(s.grade || "-")} · Section ${escapeHtml(s.section || "-")}</p>
      <div class="flex gap-2">
        <a href="./pickup-pass.html?studentId=${encodeURIComponent(studentId)}"
           class="get-pickup-pass-link flex-1 text-center py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">
          Get Pickup Pass
        </a>
        <a href="./manage-guardians.html?studentId=${encodeURIComponent(studentId)}"
           class="manage-guardians-link flex-1 text-center py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-200">
          Manage Guardians
        </a>
      </div>
    `;
    card.querySelector(".get-pickup-pass-link").addEventListener("click", () => {
      sessionStorage.setItem("pickupPassStudentId", studentId);
    });
    card.querySelector(".manage-guardians-link").addEventListener("click", () => {
      sessionStorage.setItem("pendingGuardianStudentId", studentId);
    });
    list.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Students — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/portal.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen pp-portal-body">

  <div id="parentNav" data-active="students"></div>
  <script type="module" src="../shared/parent-nav.js"></script>

  <main class="pp-page pp-page--narrow">
    <h1 class="text-xl font-bold text-ink-strong mb-3">My Students</h1>

    <div id="studentList"></div>
    <div id="emptyState" class="pp-empty hidden">
      No students are linked to your account yet. Contact your school office to be
      added as a pickup contact.
    </div>
  </main>

<script type="module">
import { auth, db } from "../shared/firebase-init.js";
import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Sign-out, the auth guard, the signed-in email and the unread-notifications
// badge are all owned by the shared parent nav (parent-nav.js). This page only
// loads the school branding and the parent's linked students.
onAuthStateChanged(auth, async (user) => {
  if (!user) return; // nav performs the redirect
  const tokenResult = await user.getIdTokenResult();
  const schoolId = tokenResult.claims.schoolId;
  // School logo + name are shown persistently in the shared nav app-bar now.
  await loadStudents(user.uid, schoolId);
});

async function loadStudents(uid, schoolId) {
  const list = document.getElementById("studentList");
  const q = query(
    collection(db, "students"),
    where("schoolId", "==", schoolId),
    where("guardianUids", "array-contains", uid)
  );

  const snap = await getDocs(q);

  if (snap.empty) {
    document.getElementById("emptyState").classList.remove("hidden");
    return;
  }

  snap.forEach((docSnap) => {
    const s = docSnap.data();
    const studentId = docSnap.id;

    const card = document.createElement("div");
    card.className = "pp-card pp-card--pad mb-3";
    card.innerHTML = `
      <p class="font-semibold text-ink-strong">${escapeHtml(s.fullName || "Unnamed Student")}</p>
      <p class="text-sm text-ink-muted mb-3">Grade ${escapeHtml(s.grade || "-")} · Section ${escapeHtml(s.section || "-")}</p>
      <div class="flex gap-2">
        <a href="./pickup-pass.html?studentId=${encodeURIComponent(studentId)}"
           class="get-pickup-pass-link pp-btn pp-btn--primary flex-1">
          Get Pickup Pass
        </a>
        <a href="./manage-guardians.html?studentId=${encodeURIComponent(studentId)}"
           class="manage-guardians-link pp-btn pp-btn--secondary flex-1">
          Manage Guardians
        </a>
      </div>
    `;
    card.querySelector(".get-pickup-pass-link").addEventListener("click", () => {
      sessionStorage.setItem("pickupPassStudentId", studentId);
    });
    card.querySelector(".manage-guardians-link").addEventListener("click", () => {
      sessionStorage.setItem("pendingGuardianStudentId", studentId);
    });
    list.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

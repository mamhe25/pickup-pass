<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parent Profile — Pickup Pass</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-md p-8 w-full max-w-sm text-center">
    <h1 class="text-xl font-bold text-gray-800 mb-1">Your Pickup Profile</h1>
    <p class="text-sm text-gray-500 mb-6">This photo is shown to school staff to confirm your identity at pickup.</p>

    <input type="file" id="photoInput" accept="image/*" class="hidden" />
    <label for="photoInput" class="cursor-pointer block w-32 h-32 mx-auto rounded-full bg-gray-100
           flex items-center justify-center border-2 border-dashed border-gray-300 overflow-hidden">
      <img id="preview" class="w-full h-full rounded-full object-cover hidden" />
      <span id="placeholder" class="text-gray-400 text-sm px-4">Tap to add photo</span>
    </label>

    <p id="uploadStatus" class="text-xs text-gray-500 mt-3 h-4"></p>

    <a href="./students.html" class="mt-6 inline-block w-full py-3 bg-indigo-600 text-white
       rounded-lg font-semibold hover:bg-indigo-700 transition">
      Continue to My Students →
    </a>
  </div>

<script type="module">
import { auth, db } from "../shared/firebase-init.js";
import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// NOTE: this deliberately does NOT use Firebase/Cloud Storage. As of
// Feb 3, 2026, Cloud Storage for Firebase requires the pay-as-you-go
// Blaze plan (a linked billing account) even for entirely free-tier
// usage. To stay on the free Spark plan, the compressed avatar is
// base64-encoded and written directly into the user's Firestore profile
// document as a data URI instead of being uploaded to a bucket.

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
});

document.getElementById("photoInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const status = document.getElementById("uploadStatus");
  status.textContent = "Compressing...";

  try {
    const compressedBlob = await compressImage(file, 400, 400, 50 * 1024);

    const preview = document.getElementById("preview");
    preview.src = URL.createObjectURL(compressedBlob);
    preview.classList.remove("hidden");
    document.getElementById("placeholder").classList.add("hidden");

    status.textContent = "Saving...";
    const uid = auth.currentUser.uid;

    // FileReader.readAsDataURL already produces a full "data:image/jpeg;
    // base64,..." string — exactly the shape both the web and Android
    // clients render directly via <img src>/SmartImage, no separate
    // base64-encoding step needed.
    const dataUri = await blobToDataUri(compressedBlob);

    await updateDoc(doc(db, "users", uid), { photoUrl: dataUri });
    status.textContent = `Saved (${(compressedBlob.size / 1024).toFixed(1)}KB)`;
  } catch (err) {
    status.textContent = "Save failed: " + err.message;
  }
});

function blobToDataUri(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/**
 * Center-crops to a square, resizes to targetW x targetH, then iteratively
 * lowers JPEG quality until under maxBytes — keeps the resulting Firestore
 * document comfortably under the 1MiB per-document limit (base64 inflates
 * size by ~33%, so a 50KB target stays around ~67KB encoded).
 */
function compressImage(file, targetW, targetH, maxBytes) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext("2d");

      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, targetW, targetH);

      let quality = 0.9;
      const tryCompress = () => {
        canvas.toBlob(
          (blob) => {
            if (!blob) return reject(new Error("Compression failed"));
            if (blob.size <= maxBytes || quality <= 0.3) {
              resolve(blob);
            } else {
              quality -= 0.1;
              tryCompress();
            }
          },
          "image/jpeg",
          quality
        );
      };
      tryCompress();
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
</script>
</body>
</html>

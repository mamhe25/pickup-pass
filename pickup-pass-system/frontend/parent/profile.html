<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parent Profile — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/portal.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen pp-portal-body">

  <div id="parentNav" data-active="profile"></div>
  <script type="module" src="../shared/parent-nav.js"></script>

  <main class="pp-page pp-page--compact">
    <div class="pp-card pp-card--pad text-center">
      <h1 class="text-xl font-bold text-ink-strong mb-1">Your Pickup Profile</h1>
      <p class="text-sm text-ink-muted mb-4">This photo is shown to school staff to confirm your identity at pickup.</p>

      <input type="file" id="photoInput" accept="image/*" class="hidden" />
      <label for="photoInput" class="cursor-pointer w-32 h-32 mx-auto rounded-full bg-surface-variant
             flex items-center justify-center border-2 border-dashed border-hairline-strong overflow-hidden">
        <img id="preview" class="w-full h-full rounded-full object-cover hidden" />
        <span id="placeholder" class="text-ink-subtle text-sm px-4">Tap to add photo</span>
      </label>

      <p id="uploadStatus" class="text-xs text-ink-muted mt-3 min-h-[1rem]"></p>

      <!-- Deliberately prominent on this page (more so than the subtle nav email):
           on a shared/kiosk device this is what makes it obvious if you're still
           signed in as the previous person before you change a photo. -->
      <p id="profileSignedInAs" class="pp-badge pp-badge--neutral mt-4 mx-auto"></p>

      <a href="./students.html" class="pp-btn pp-btn--primary w-full mt-4">
        Continue to My Students
      </a>
    </div>
  </main>

<script type="module">
import { auth, db } from "../shared/firebase-init.js";
import { doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Sign-out and the nav-level email are owned by the shared parent nav.
// This page keeps its own auth listener to load the existing photo, and
// deliberately shows a more prominent "Signed in as" badge (see HTML comment).
onAuthStateChanged(auth, async (user) => {
  if (!user) return; // nav performs the redirect

  document.getElementById("profileSignedInAs").textContent = `Signed in as ${user.email}`;

  const userSnap = await getDoc(doc(db, "users", user.uid));
  if (userSnap.exists() && userSnap.data().photoUrl) {
    const preview = document.getElementById("preview");
    preview.src = userSnap.data().photoUrl;
    preview.classList.remove("hidden");
    document.getElementById("placeholder").classList.add("hidden");
  }
});

document.getElementById("photoInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const status = document.getElementById("uploadStatus");
  status.textContent = "Compressing...";

  try {
    const compressedBlob = await compressImage(file, 400, 400, 50 * 1024);

    const preview = document.getElementById("preview");
    preview.src = URL.createObjectURL(compressedBlob);
    preview.classList.remove("hidden");
    document.getElementById("placeholder").classList.add("hidden");

    status.textContent = "Saving...";
    const uid = auth.currentUser.uid;

    // FileReader.readAsDataURL already produces a full "data:image/jpeg;
    // base64,..." string — exactly the shape both the web and Android
    // clients render directly via <img src>/SmartImage, no separate
    // base64-encoding step needed.
    const dataUri = await blobToDataUri(compressedBlob);

    await updateDoc(doc(db, "users", uid), { photoUrl: dataUri });
    status.textContent = `Saved (${(compressedBlob.size / 1024).toFixed(1)}KB)`;
  } catch (err) {
    status.textContent = "Save failed: " + err.message;
  }
});

function blobToDataUri(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/**
 * Center-crops to a square, resizes to targetW x targetH, then iteratively
 * lowers JPEG quality until under maxBytes — keeps the resulting Firestore
 * document comfortably under the 1MiB per-document limit (base64 inflates
 * size by ~33%, so a 50KB target stays around ~67KB encoded).
 */
function compressImage(file, targetW, targetH, maxBytes) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext("2d");

      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, targetW, targetH);

      let quality = 0.9;
      const tryCompress = () => {
        canvas.toBlob(
          (blob) => {
            if (!blob) return reject(new Error("Compression failed"));
            if (blob.size <= maxBytes || quality <= 0.3) {
              resolve(blob);
            } else {
              quality -= 0.1;
              tryCompress();
            }
          },
          "image/jpeg",
          quality
        );
      };
      tryCompress();
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
</script>
</body>
</html>

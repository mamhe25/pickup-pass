<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launch Readiness — PickupPass</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="../shared/components.css"><link rel="stylesheet" href="../shared/portal.css"><script src="https://cdn.tailwindcss.com"></script><script src="../shared/tailwind-config.js"></script></head><body class="min-h-screen pp-portal-body">
<div id="adminNav" data-active="launch"></div><script type="module" src="../shared/school-admin-nav.js"></script><main class="pp-page"><div class="pp-page-head"><div><h1>School Launch Readiness</h1><p>Complete required automated and manual checks, then request final platform review. Pickup locations remain optional by design.</p></div><div class="pp-actions"><button id="refreshBtn" class="pp-btn pp-btn--ghost">Refresh</button><button id="requestReviewBtn" class="pp-btn pp-btn--primary">Request launch review</button></div></div>
<div class="pp-grid"><div class="pp-kpi"><div class="pp-kpi__label">Effective status</div><div id="effectiveStatus" class="pp-kpi__value text-lg">—</div></div><div class="pp-kpi"><div class="pp-kpi__label">Blockers</div><div id="blockers" class="pp-kpi__value">—</div></div><div class="pp-kpi"><div class="pp-kpi__label">Warnings</div><div id="warnings" class="pp-kpi__value">—</div></div><div class="pp-kpi"><div class="pp-kpi__label">Passed</div><div id="passed" class="pp-kpi__value">—</div></div></div>
<section class="pp-section"><div class="pp-section__head"><h2>Manual confirmations</h2><button id="saveChecksBtn" class="pp-btn pp-btn--secondary">Save checks</button></div><div class="pp-section__body space-y-3"><label class="flex gap-3"><input id="scannerDeviceTested" type="checkbox"><span><strong>Scanner device tested</strong><span class="block pp-mini">Camera permission, QR scanning, connectivity, and staff sign-in tested on the actual device.</span></span></label><label class="flex gap-3"><input id="guardianQrTested" type="checkbox"><span><strong>End-to-end guardian QR test completed</strong><span class="block pp-mini">Guardian QR generation through staff verification and approval.</span></span></label><label class="flex gap-3"><input id="dismissalStaffBriefed" type="checkbox"><span><strong>Dismissal staff briefing completed</strong><span class="block pp-mini">Staff know approval flow, duplicate-pass handling, and escalation.</span></span></label><label class="flex gap-3"><input id="emergencyProcedureReviewed" type="checkbox"><span><strong>Emergency procedure reviewed</strong><span class="block pp-mini">Fallback for device/network problems and authorized manual pickup.</span></span></label></div></section>
<section class="pp-section"><div class="pp-section__head"><h2>Readiness checks</h2></div><div class="pp-table-wrap"><table class="pp-table"><thead><tr><th>Check</th><th>Required</th><th>Status</th><th>Detail</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="pp-empty">Loading…</td></tr></tbody></table></div></section></main>
<script type="module">import{showToast}from'../shared/firebase-init.js';import{apiJson,requireRole,bindRefresh,escapeHtml,statusPill}from'../shared/portal.js';let readiness={};async function load(){readiness=await apiJson('/school-admin/launch-readiness');effectiveStatus.innerHTML=statusPill(readiness.effectiveStatus||readiness.reviewStatus||'draft');blockers.textContent=readiness.blockerCount??0;warnings.textContent=readiness.warningCount??0;passed.textContent=readiness.passedCount??0;const m=readiness.manualChecks||{};scannerDeviceTested.checked=!!m.scannerDeviceTested;guardianQrTested.checked=!!m.guardianQrTested;dismissalStaffBriefed.checked=!!m.dismissalStaffBriefed;emergencyProcedureReviewed.checked=!!m.emergencyProcedureReviewed;requestReviewBtn.disabled=!readiness.readyForReview||['review_requested','approved'].includes(readiness.reviewStatus);rows.innerHTML=(readiness.checks||[]).map(c=>`<tr><td><strong>${escapeHtml(c.label||c.key)}</strong></td><td>${c.required?'Yes':'No'}</td><td>${statusPill(c.status)}</td><td>${escapeHtml(c.detail||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="pp-empty">No checks.</td></tr>';}
saveChecksBtn.onclick=async()=>{const manualChecks={scannerDeviceTested:scannerDeviceTested.checked,guardianQrTested:guardianQrTested.checked,dismissalStaffBriefed:dismissalStaffBriefed.checked,emergencyProcedureReviewed:emergencyProcedureReviewed.checked};try{await apiJson('/school-admin/launch-readiness/manual-checks',{method:'PUT',body:JSON.stringify({manualChecks})});showToast('Manual checks saved.');await load();}catch(e){showToast(e.message,'error');}};requestReviewBtn.onclick=async()=>{if(!confirm('Request final platform launch review?'))return;try{await apiJson('/school-admin/launch-readiness/request-review',{method:'POST'});showToast('Launch review requested.');await load();}catch(e){showToast(e.message,'error');}};bindRefresh('refreshBtn',load);requireRole('school_admin',load);</script></body></html>

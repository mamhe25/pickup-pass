<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invite Teacher — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen">

  <div id="adminNav" data-active="staff"></div>
  <script type="module" src="../shared/school-admin-nav.js"></script>

  <main class="max-w-lg mx-auto p-4">
    <h1 class="text-xl font-bold text-ink-strong mb-1">Invite a Teacher</h1>
    <p class="text-sm text-ink-muted mb-4">
      They'll get an email to set their password. Once signed in, they can
      run the dismissal scanner and register parent pickup contacts.
    </p>

    <div class="pp-card pp-card--pad">
      <form id="inviteForm" class="space-y-3">
        <input id="lastName" type="text" required placeholder="Last name" class="pp-field" />
        <input id="firstName" type="text" required placeholder="First name" class="pp-field" />
        <div class="flex gap-2">
          <input id="middleInitial" type="text" maxlength="4" placeholder="M.I." class="pp-field w-1/3" />
          <input id="suffix" type="text" placeholder="Suffix (Jr., III...)" class="pp-field w-2/3" />
        </div>
        <input id="teacherEmail" type="email" required placeholder="Email address" class="pp-field" />

        <p id="errorMsg" class="pp-alert pp-alert--danger hidden" style="display: none"></p>
        <p id="successMsg" class="pp-alert pp-alert--success hidden" style="display: none"></p>

        <button type="submit" class="pp-btn pp-btn--primary w-full">
          Send Invite
        </button>
      </form>
    </div>
  </main>

<script type="module">
// Sign-out, auth guard and signed-in email are owned by the shared admin nav.
import { authedFetch, setSubmitButtonBusy, showToast } from "../shared/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

document.getElementById("inviteForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitButton = e.currentTarget.querySelector('button[type="submit"]');
  if (submitButton.disabled) return;
  setSubmitButtonBusy(submitButton, true, "Sending invite…");
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  errorMsg.classList.add("hidden");
  successMsg.classList.add("hidden");

  const lastName = document.getElementById("lastName").value.trim();
  const firstName = document.getElementById("firstName").value.trim();
  const middleInitial = document.getElementById("middleInitial").value.trim();
  const suffix = document.getElementById("suffix").value.trim();
  const email = document.getElementById("teacherEmail").value.trim();

  try {
    const res = await authedFetch("/school-admin/staff", {
      method: "POST",
      body: JSON.stringify({ lastName, firstName, middleInitial, suffix, email }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not send invite");

    successMsg.textContent = data.emailSent
      ? `Invite sent to ${email}.`
      : `Account created for ${email}, but the invite email couldn't be sent — ask them to use "Forgot password?" on the sign-in page with this email.`;
    successMsg.classList.remove("hidden");
    showToast(successMsg.textContent, data.emailSent ? "success" : "warning");
    e.target.reset();
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.classList.remove("hidden");
    showToast(err.message || "Could not send invite.", "error");
  } finally {
    setSubmitButtonBusy(submitButton, false);
  }
});
</script>
</body>
</html>

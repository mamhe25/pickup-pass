<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invite Teacher — Pickup Pass</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <div class="max-w-sm mx-auto pt-2">
    <div class="flex items-center justify-between">
      <a href="./branding.html" class="text-sm text-indigo-600 font-medium">← School Branding</a>
      <button id="signOutBtn" class="text-xs text-gray-400 underline">Sign out</button>
    </div>
    <p id="currentUserEmail" class="text-xs text-gray-400 mt-1"></p>

    <h1 class="text-xl font-bold text-gray-800 mt-2 mb-1">Invite a Teacher</h1>
    <p class="text-sm text-gray-500 mb-6">
      They'll get an email to set their password. Once signed in, they can
      run the dismissal scanner and register parent pickup contacts.
    </p>

    <div class="bg-white rounded-2xl shadow-sm p-6">
      <form id="inviteForm" class="space-y-3">
        <input id="lastName" type="text" required placeholder="Last name"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <input id="firstName" type="text" required placeholder="First name"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <div class="flex gap-2">
          <input id="middleInitial" type="text" maxlength="4" placeholder="M.I."
            class="w-1/3 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <input id="suffix" type="text" placeholder="Suffix (Jr., III...)"
            class="w-2/3 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <input id="teacherEmail" type="email" required placeholder="Email address"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />

        <p id="errorMsg" class="hidden" style="display: none"></p>
        <p id="successMsg" class="hidden" style="display: none"></p>

        <button type="submit"
          class="w-full py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition">
          Send Invite
        </button>
      </form>
    </div>
  </div>

<script type="module">
import { auth, authedFetch, setSubmitButtonBusy, showToast } from "../shared/firebase-init.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "../login.html";
});

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
  document.getElementById("currentUserEmail").textContent = user.email;
});

document.getElementById("inviteForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitButton = e.currentTarget.querySelector('button[type="submit"]');
  if (submitButton.disabled) return;
  setSubmitButtonBusy(submitButton, true, "Sending invite…");
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  errorMsg.classList.add("hidden");
  successMsg.classList.add("hidden");

  const lastName = document.getElementById("lastName").value.trim();
  const firstName = document.getElementById("firstName").value.trim();
  const middleInitial = document.getElementById("middleInitial").value.trim();
  const suffix = document.getElementById("suffix").value.trim();
  const email = document.getElementById("teacherEmail").value.trim();

  try {
    const res = await authedFetch("/school-admin/staff", {
      method: "POST",
      body: JSON.stringify({ lastName, firstName, middleInitial, suffix, email }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not send invite");

    successMsg.textContent = data.emailSent
      ? `Invite sent to ${email}.`
      : `Account created for ${email}, but the invite email couldn't be sent — ask them to use "Forgot password?" on the sign-in page with this email.`;
    successMsg.classList.remove("hidden");
    showToast(successMsg.textContent, data.emailSent ? "success" : "warning");
    e.target.reset();
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.classList.remove("hidden");
    showToast(err.message || "Could not send invite.", "error");
  } finally {
    setSubmitButtonBusy(submitButton, false);
  }
});
</script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log — PickupPass</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="../shared/components.css"><link rel="stylesheet" href="../shared/portal.css"><script src="https://cdn.tailwindcss.com"></script><script src="../shared/tailwind-config.js"></script></head><body class="min-h-screen pp-portal-body"><div id="adminNav" data-active="audit"></div><script type="module" src="../shared/school-admin-nav.js"></script><main class="pp-page"><div class="pp-page-head"><div><h1>Audit Log</h1><p>Recent administrative and pickup-security events for this school tenant.</p></div><div class="pp-actions"><select id="limit" class="pp-field"><option>50</option><option selected>100</option><option>250</option></select><button id="refreshBtn" class="pp-btn pp-btn--ghost">Refresh</button></div></div><section class="pp-section mt-0"><div class="pp-table-wrap"><table class="pp-table"><thead><tr><th>Time</th><th>Action</th><th>Actor</th><th>Target</th><th>Details</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="pp-empty">Loading…</td></tr></tbody></table></div></section></main><script type="module">import{apiJson,requireRole,bindRefresh,escapeHtml,fmtDate}from'../shared/portal.js';async function load(){const d=await apiJson('/school-admin/audit-events?limit='+encodeURIComponent(limit.value));rows.innerHTML=(d.events||[]).map(e=>`<tr><td>${escapeHtml(fmtDate(e.timestamp))}</td><td><strong>${escapeHtml(e.action||e.eventType||'')}</strong></td><td>${escapeHtml(e.actorEmail||e.actorUid||e.uid||'—')}</td><td>${escapeHtml((e.targetType||'')+(e.targetId?' / '+e.targetId:''))}</td><td><pre class="pp-mini whitespace-pre-wrap">${escapeHtml(JSON.stringify(e.details||e.metadata||{},null,1))}</pre></td></tr>`).join('')||'<tr><td colspan="5" class="pp-empty">No audit events.</td></tr>';}limit.onchange=load;bindRefresh('refreshBtn',load);requireRole('school_admin',load);</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Send Announcement — PickupPass</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="../shared/components.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="min-h-screen">

  <div id="adminNav" data-active="announce"></div>
  <script type="module" src="../shared/school-admin-nav.js"></script>

  <main class="max-w-lg mx-auto p-4">
    <h1 class="text-xl font-bold text-ink-strong mb-1">Send an Announcement</h1>
    <p class="text-sm text-ink-muted mb-4">Goes out immediately to everyone you select — as a push and in their notification inbox.</p>

    <div class="pp-card pp-card--pad">
      <form id="broadcastForm" class="space-y-3">
        <div>
          <label class="pp-label" for="title">Title</label>
          <input id="title" type="text" required maxlength="120" placeholder="e.g. Early Dismissal Friday" class="pp-field" />
        </div>
        <div>
          <label class="pp-label" for="body">Message</label>
          <textarea id="body" required rows="4" maxlength="1000" placeholder="What does everyone need to know?" class="pp-field" style="min-height:auto;"></textarea>
        </div>

        <div>
          <p class="pp-label">Send to</p>
          <label class="flex items-center gap-2 text-sm mb-1 text-ink">
            <input type="checkbox" id="audienceTeacher" checked class="rounded accent-brand-600" /> Teachers
          </label>
          <label class="flex items-center gap-2 text-sm text-ink">
            <input type="checkbox" id="audienceParent" checked class="rounded accent-brand-600" /> Guardians
          </label>
        </div>

        <p id="formError" class="pp-alert pp-alert--danger hidden"></p>
        <p id="formSuccess" class="pp-alert pp-alert--success hidden"></p>

        <button type="submit" id="sendBtn" class="pp-btn pp-btn--primary w-full">
          Send Announcement
        </button>
      </form>
    </div>
  </main>

<script type="module">
// Sign-out, auth guard and signed-in email are owned by the shared admin nav.
import { authedFetch } from "../shared/firebase-init.js";

document.getElementById("broadcastForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const formError = document.getElementById("formError");
  const formSuccess = document.getElementById("formSuccess");
  const sendBtn = document.getElementById("sendBtn");
  formError.classList.add("hidden");
  formSuccess.classList.add("hidden");

  const title = document.getElementById("title").value.trim();
  const body = document.getElementById("body").value.trim();
  const audience = [];
  if (document.getElementById("audienceTeacher").checked) audience.push("teacher");
  if (document.getElementById("audienceParent").checked) audience.push("parent");

  if (audience.length === 0) {
    formError.textContent = "Select at least one audience";
    formError.classList.remove("hidden");
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";

  try {
    const res = await authedFetch("/school-admin/broadcasts", {
      method: "POST",
      body: JSON.stringify({ title, body, audience }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not send announcement");

    formSuccess.textContent = `Sent to ${data.recipientCount} ${data.recipientCount === 1 ? "person" : "people"}.`;
    formSuccess.classList.remove("hidden");
    e.target.reset();
    document.getElementById("audienceTeacher").checked = true;
    document.getElementById("audienceParent").checked = true;
  } catch (err) {
    formError.textContent = err.message;
    formError.classList.remove("hidden");
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "Send Announcement";
  }
});
</script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dismissal Reports — PickupPass</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="../shared/components.css"><link rel="stylesheet" href="../shared/portal.css"><script src="https://cdn.tailwindcss.com"></script><script src="../shared/tailwind-config.js"></script></head><body class="min-h-screen pp-portal-body">
<div id="adminNav" data-active="reports"></div><script type="module" src="../shared/school-admin-nav.js"></script><main class="pp-page"><div class="pp-page-head"><div><h1>Dismissal Reports</h1><p>Review historical release activity and export a CSV for school records.</p></div><button id="exportBtn" class="pp-btn pp-btn--secondary">Export CSV</button></div>
<section class="pp-section mt-0"><div class="pp-section__body"><form id="filterForm" class="pp-form-grid"><label>From<input id="fromDate" type="date" class="pp-field" required></label><label>To<input id="toDate" type="date" class="pp-field" required></label><label>Grade<input id="grade" class="pp-field" placeholder="Optional"></label><label>Section<input id="section" class="pp-field" placeholder="Optional"></label><div class="flex items-end"><button class="pp-btn pp-btn--primary w-full">Run report</button></div></form></div></section>
<div id="featureNotice" class="pp-alert pp-alert--info hidden mt-3"></div><div class="pp-grid mt-3"><div class="pp-kpi"><div class="pp-kpi__label">Total releases</div><div id="total" class="pp-kpi__value">—</div></div><div class="pp-kpi"><div class="pp-kpi__label">Unique students</div><div id="unique" class="pp-kpi__value">—</div></div><div class="pp-kpi"><div class="pp-kpi__label">QR releases</div><div id="qr" class="pp-kpi__value">—</div></div><div class="pp-kpi"><div class="pp-kpi__label">Manual overrides</div><div id="manual" class="pp-kpi__value">—</div></div></div>
<section class="pp-section"><div class="pp-section__head"><h2>Daily activity</h2></div><div class="pp-table-wrap"><table class="pp-table"><thead><tr><th>Date</th><th>Releases</th></tr></thead><tbody id="dailyRows"><tr><td colspan="2" class="pp-empty">Run a report.</td></tr></tbody></table></div></section>
<section class="pp-section"><div class="pp-section__head"><h2>Grade / section activity</h2></div><div class="pp-table-wrap"><table class="pp-table"><thead><tr><th>Grade / section</th><th>Releases</th></tr></thead><tbody id="groupRows"><tr><td colspan="2" class="pp-empty">Run a report.</td></tr></tbody></table></div></section></main>
<script type="module">import {showToast} from '../shared/firebase-init.js';import {apiJson,requireRole,downloadAuthed,escapeHtml} from '../shared/portal.js';
function iso(d){return d.toISOString().slice(0,10)}const now=new Date(),week=new Date(now);week.setDate(now.getDate()-7);fromDate.value=iso(week);toDate.value=iso(now);
function query(){const p=new URLSearchParams({from:fromDate.value,to:toDate.value});if(grade.value.trim())p.set('grade',grade.value.trim());if(section.value.trim())p.set('section',section.value.trim());return p.toString();}
async function load(){try{featureNotice.classList.add('hidden');const d=await apiJson('/school-admin/reports/dismissals/summary?'+query());total.textContent=d.totalReleases??0;unique.textContent=d.uniqueStudentsReleased??0;qr.textContent=d.qrReleases??0;manual.textContent=d.manualOverrides??0;const daily=d.dailyCounts||{};dailyRows.innerHTML=Object.entries(daily).length?Object.entries(daily).map(([k,v])=>`<tr><td>${escapeHtml(k)}</td><td>${v}</td></tr>`).join(''):'<tr><td colspan="2" class="pp-empty">No releases in this range.</td></tr>';const groups=d.gradeSectionCounts||{};groupRows.innerHTML=Object.entries(groups).length?Object.entries(groups).map(([k,v])=>`<tr><td>${escapeHtml(k)}</td><td>${v}</td></tr>`).join(''):'<tr><td colspan="2" class="pp-empty">No grouped activity.</td></tr>';}catch(e){featureNotice.textContent=e.status===403?'Advanced reporting is disabled by the current plan/feature settings.':e.message;featureNotice.classList.remove('hidden');showToast(e.message,'error');}}
filterForm.onsubmit=e=>{e.preventDefault();load()};exportBtn.onclick=async()=>{try{await downloadAuthed('/school-admin/reports/dismissals/export?'+query(),'pickuppass-dismissals.csv');}catch(e){showToast(e.message,'error');}};requireRole('school_admin',load);</script></body></html>

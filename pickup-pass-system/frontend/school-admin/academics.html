<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Structure — PickupPass</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="../shared/components.css"><link rel="stylesheet" href="../shared/portal.css"><script src="https://cdn.tailwindcss.com"></script><script src="../shared/tailwind-config.js"></script></head><body class="min-h-screen pp-portal-body">
<div id="adminNav" data-active="academics"></div><script type="module" src="../shared/school-admin-nav.js"></script>
<main class="pp-page"><div class="pp-page-head"><div><h1>Academic Years & Sections</h1><p>Structure the school roster by academic year, grade, and section while preserving legacy student grade/section fields.</p></div><button id="refreshBtn" class="pp-btn pp-btn--ghost">Refresh</button></div>
<div class="pp-grid"><section class="pp-section mt-0"><div class="pp-section__head"><h2>Create academic year</h2></div><div class="pp-section__body"><form id="yearForm" class="space-y-3"><input id="yearNameInput" class="pp-field" placeholder="2026–2027" required><div class="grid grid-cols-2 gap-2"><input id="yearStart" type="date" class="pp-field"><input id="yearEnd" type="date" class="pp-field"></div><label class="flex gap-2 items-center text-sm"><input id="yearCurrent" type="checkbox"> Make current</label><button class="pp-btn pp-btn--primary w-full">Create year</button></form></div></section>
<section class="pp-section mt-0"><div class="pp-section__head"><h2>Create grade/section</h2></div><div class="pp-section__body"><form id="sectionForm" class="space-y-3"><select id="sectionYear" class="pp-field" required></select><input id="gradeLevel" class="pp-field" placeholder="Grade 5" required><input id="sectionName" class="pp-field" placeholder="Section A" required><button class="pp-btn pp-btn--primary w-full">Create section</button></form></div></section></div>
<section class="pp-section"><div class="pp-section__head"><h2>Academic years</h2></div><div class="pp-table-wrap"><table class="pp-table"><thead><tr><th>Year</th><th>Dates</th><th>Status</th><th></th></tr></thead><tbody id="yearRows"></tbody></table></div></section>
<section class="pp-section"><div class="pp-section__head"><h2>Grade sections</h2></div><div class="pp-table-wrap"><table class="pp-table"><thead><tr><th>Academic year</th><th>Grade</th><th>Section</th><th>Status</th><th></th></tr></thead><tbody id="sectionRows"></tbody></table></div></section>
</main><script type="module">
import { showToast } from '../shared/firebase-init.js';import { apiJson,requireRole,bindRefresh,escapeHtml,statusPill } from '../shared/portal.js';let structure={};
async function load(){structure=await apiJson('/academic-structure');const years=structure.academicYears||[],sections=structure.gradeSections||[];sectionYear.innerHTML='<option value="">Select academic year…</option>'+years.filter(y=>y.status!=='archived').map(y=>`<option value="${escapeHtml(y.id)}">${escapeHtml(y.name)}</option>`).join('');yearRows.innerHTML=years.length?years.map(y=>`<tr><td><strong>${escapeHtml(y.name)}</strong></td><td>${escapeHtml(y.startDate||'—')} → ${escapeHtml(y.endDate||'—')}</td><td>${y.isCurrent?statusPill('current'):statusPill(y.status||'active')}</td><td>${!y.isCurrent?`<button class="pp-btn pp-btn--ghost makeCurrent" data-id="${escapeHtml(y.id)}">Set current</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="4" class="pp-empty">No academic years.</td></tr>';sectionRows.innerHTML=sections.length?sections.map(s=>`<tr><td>${escapeHtml(s.academicYearName||'')}</td><td>${escapeHtml(s.gradeLevel)}</td><td>${escapeHtml(s.sectionName)}</td><td>${statusPill(s.active===false?'archived':'active')}</td><td><button class="pp-btn pp-btn--ghost toggleSection" data-id="${escapeHtml(s.id)}" data-active="${s.active!==false}">${s.active===false?'Reactivate':'Archive'}</button></td></tr>`).join(''):'<tr><td colspan="5" class="pp-empty">No grade sections.</td></tr>';document.querySelectorAll('.makeCurrent').forEach(b=>b.onclick=async()=>{try{await apiJson(`/school-admin/academic-years/${encodeURIComponent(b.dataset.id)}/current`,{method:'PUT'});showToast('Current academic year updated.');await load();}catch(e){showToast(e.message,'error');}});document.querySelectorAll('.toggleSection').forEach(b=>b.onclick=async()=>{try{await apiJson(`/school-admin/grade-sections/${encodeURIComponent(b.dataset.id)}/status`,{method:'PUT',body:JSON.stringify({active:b.dataset.active!=='true'})});showToast('Section status updated.');await load();}catch(e){showToast(e.message,'error');}});}
yearForm.onsubmit=async e=>{e.preventDefault();try{await apiJson('/school-admin/academic-years',{method:'POST',body:JSON.stringify({name:yearNameInput.value.trim(),startDate:yearStart.value,endDate:yearEnd.value,current:yearCurrent.checked})});showToast('Academic year created.');yearForm.reset();await load();}catch(err){showToast(err.message,'error');}};
sectionForm.onsubmit=async e=>{e.preventDefault();try{await apiJson('/school-admin/grade-sections',{method:'POST',body:JSON.stringify({academicYearId:sectionYear.value,gradeLevel:gradeLevel.value.trim(),sectionName:sectionName.value.trim()})});showToast('Grade section created.');sectionForm.reset();await load();}catch(err){showToast(err.message,'error');}};
bindRefresh('refreshBtn',load);requireRole('school_admin',load);
</script></body></html>

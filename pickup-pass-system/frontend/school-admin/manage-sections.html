<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher Sections — Pickup Pass</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <div class="max-w-sm mx-auto pt-2">
    <div class="flex items-center justify-between">
      <a href="./branding.html" class="text-sm text-indigo-600 font-medium">← School Admin</a>
      <button id="signOutBtn" class="text-xs text-gray-400 underline">Sign out</button>
    </div>
    <p id="currentUserEmail" class="text-xs text-gray-400 mt-1 mb-4"></p>

    <h1 class="text-xl font-bold text-gray-800 mb-1">Teacher Sections</h1>
    <p class="text-sm text-gray-500 mb-4">
      Assign each teacher's grade/section so their broadcasts reach the right guardians.
    </p>

    <div id="teacherList" class="space-y-3"></div>
    <div id="emptyState" class="hidden bg-white rounded-xl p-6 text-center text-sm text-gray-500">
      No teachers yet — invite one from School Admin first.
    </div>
    <div id="loadingState" class="text-center text-sm text-gray-400 py-6">Loading…</div>
  </div>

<script type="module">
import { auth, authedFetch } from "../shared/firebase-init.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "../login.html";
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
    return;
  }
  document.getElementById("currentUserEmail").textContent = user.email;
  await loadTeachers();
});

async function loadTeachers() {
  const loadingState = document.getElementById("loadingState");
  loadingState.classList.remove("hidden");

  try {
    const res = await authedFetch("/school-admin/staff", { method: "GET" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not load teachers");

    loadingState.classList.add("hidden");
    if (data.teachers.length === 0) {
      document.getElementById("emptyState").classList.remove("hidden");
      return;
    }
    renderTeachers(data.teachers);
  } catch (err) {
    loadingState.textContent = err.message;
  }
}

function renderTeachers(teachers) {
  const list = document.getElementById("teacherList");
  list.innerHTML = "";

  teachers.forEach((t) => {
    const card = document.createElement("div");
    card.className = "bg-white rounded-xl shadow-sm p-4";
    card.innerHTML = `
      <p class="font-semibold text-gray-800">${escapeHtml(t.displayName || t.email)}</p>
      <p class="text-xs text-gray-400 mb-2">${escapeHtml(t.email)}</p>
      <div class="sections-list flex flex-wrap gap-1 mb-2"></div>
      <div class="flex gap-2">
        <input type="text" placeholder="Grade" class="grade-input w-1/3 border border-gray-300 rounded-lg px-2 py-1.5 text-sm" />
        <input type="text" placeholder="Section" class="section-input w-1/3 border border-gray-300 rounded-lg px-2 py-1.5 text-sm" />
        <button class="add-section-btn w-1/3 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">Add</button>
      </div>
      <p class="save-status text-xs text-gray-400 mt-1"></p>
    `;

    let sections = [...(t.assignedSections || [])];
    const sectionsList = card.querySelector(".sections-list");
    const saveStatus = card.querySelector(".save-status");

    function renderChips() {
      sectionsList.innerHTML = sections.length === 0
        ? '<span class="text-xs text-gray-400">No sections assigned yet</span>'
        : "";
      sections.forEach((s, i) => {
        const chip = document.createElement("span");
        chip.className = "inline-flex items-center gap-1 bg-indigo-50 text-indigo-700 text-xs px-2 py-1 rounded-full";
        chip.innerHTML = `Grade ${escapeHtml(s.grade)} · ${escapeHtml(s.section)} <button class="font-bold">×</button>`;
        chip.querySelector("button").addEventListener("click", async () => {
          sections.splice(i, 1);
          renderChips();
          await save();
        });
        sectionsList.appendChild(chip);
      });
    }

    async function save() {
      saveStatus.textContent = "Saving…";
      try {
        const res = await authedFetch(`/school-admin/staff/${t.uid}/sections`, {
          method: "PUT",
          body: JSON.stringify({ sections }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not save");
        saveStatus.textContent = "Saved";
        setTimeout(() => { saveStatus.textContent = ""; }, 1500);
      } catch (err) {
        saveStatus.textContent = err.message;
      }
    }

    card.querySelector(".add-section-btn").addEventListener("click", async () => {
      const gradeInput = card.querySelector(".grade-input");
      const sectionInput = card.querySelector(".section-input");
      const grade = gradeInput.value.trim();
      const section = sectionInput.value.trim();
      if (!grade || !section) return;

      sections.push({ grade, section });
      gradeInput.value = "";
      sectionInput.value = "";
      renderChips();
      await save();
    });

    renderChips();
    list.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>

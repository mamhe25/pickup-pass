server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: pickup-pass-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}

qr:
  signing:
    secret: ${QR_SIGNING_SECRET:change-this-to-a-long-random-value-in-production}
  dismissal-window-minutes: ${DISMISSAL_WINDOW_MINUTES:120}
  token-ttl-minutes: ${QR_TOKEN_TTL_MINUTES:15}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5500}
  max-guardians-per-student: ${MAX_GUARDIANS_PER_STUDENT:4}
  school-time-zone: ${SCHOOL_TIME_ZONE:Asia/Manila}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

bootstrap:
  secret: ${BOOTSTRAP_SECRET:}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    com.pickuppass: INFO

# Phase 2 scheduled announcements. Cloud Run instances can all run the sweep;
# Firestore transaction claiming prevents normal duplicate processing.
pickuppass:
  broadcast-scheduler-ms: ${BROADCAST_SCHEDULER_MS:30000}
  billing:
    reconcile-ms: ${BILLING_RECONCILE_MS:3600000}
    company-name: ${BILLING_COMPANY_NAME:PickupPass}
    company-address: ${BILLING_COMPANY_ADDRESS:}
    support-email: ${BILLING_SUPPORT_EMAIL:}
    from-email: ${BILLING_FROM_EMAIL:}
    from-name: ${BILLING_FROM_NAME:PickupPass Billing}
    reminders-enabled: ${BILLING_REMINDERS_ENABLED:true}
    reminder-scan-ms: ${BILLING_REMINDER_SCAN_MS:21600000}
  payment-webhooks:
    generic-hmac-secret: ${PAYMENT_WEBHOOK_GENERIC_SECRET:}
  operations:
    health-scan-ms: ${SAAS_OPERATIONS_HEALTH_SCAN_MS:86400000}
    stale-hours: ${SAAS_OPERATIONS_STALE_HOURS:24}
    quota-warning-percent: ${SAAS_OPERATIONS_QUOTA_WARNING_PERCENT:90}

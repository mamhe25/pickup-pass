server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: pickup-pass-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}

qr:
  signing:
    secret: ${QR_SIGNING_SECRET:change-this-to-a-long-random-value-in-production}
  dismissal-window-minutes: ${DISMISSAL_WINDOW_MINUTES:120}
  token-ttl-minutes: ${QR_TOKEN_TTL_MINUTES:15}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5500}
  max-guardians-per-student: ${MAX_GUARDIANS_PER_STUDENT:4}
  school-time-zone: ${SCHOOL_TIME_ZONE:Asia/Manila}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

bootstrap:
  secret: ${BOOTSTRAP_SECRET:}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    com.pickuppass: INFO

server:
  port: ${PORT:8080}

spring:
  application:
    name: pickup-pass-system
  jackson:
    # Without this, java.util.Date fields (e.g. PickupTokenResponse's
    # expiresAt/dismissalDeadline) serialize as raw epoch-millis numbers by
    # default, not ISO-8601 strings. The Android app's model declares those
    # fields as String and parses them with a fixed ISO SimpleDateFormat —
    # a raw number there always fails to parse, silently leaving the QR
    # pass's countdown stuck at 0 ("Expired") even right after generating a
    # fresh one. This makes every Date-typed API response a real ISO string
    # instead, which both the web app's `new Date(...)` and Android's
    # SimpleDateFormat parser handle correctly.
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}

qr:
  signing:
    secret: ${QR_SIGNING_SECRET:change-this-to-a-long-random-value-in-production}
  dismissal-window-minutes: 120
  token-ttl-minutes: 15

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5500}
  max-guardians-per-student: ${MAX_GUARDIANS_PER_STUDENT:4}

bootstrap:
  # Required to call POST /api/bootstrap/master-admin. Set this to a long
  # random value, use it once to create your first master_admin, then
  # remove/rotate it (the endpoint also self-disables once any master_admin
  # exists, but rotating the secret is good hygiene regardless).
  secret: ${BOOTSTRAP_SECRET:}

logging:
  level:
    com.pickuppass: INFO
